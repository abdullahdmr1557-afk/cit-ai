<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Çıt Chat</title>
<style>
body{margin:0;font-family:Arial;background:#111;color:white}
header{background:#ff7a00;padding:15px;text-align:center;font-size:22px;font-weight:bold;color:black}
header span{font-size:28px}
#chat{padding:15px;height:60vh;overflow-y:auto}
.msg{background:#222;padding:10px 14px;border-radius:15px;margin:8px 0;max-width:80%}
.me{background:#ff7a00;color:black;margin-left:auto}
.small{font-size:11px;opacity:0.7}
#box{display:flex;gap:8px;padding:12px;background:#000;position:fixed;bottom:0;left:0;right:0}
input{flex:1;padding:12px;border-radius:20px;border:none;outline:none}
button{padding:12px 16px;border-radius:20px;border:none;background:#ff7a00;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<header>🐦 Çıt Chat <br><small style="font-size:13px;color:white">Konuş, çıtla, silinsin!</small></header>
<div id="chat"></div>
<div id="box">
<input id="text" placeholder="Mesaj yaz...">
<button onclick="send()">Gönder</button>
<button onclick="voice()">🎤</button>
</div>
<script>
function send(){
  let t=document.getElementById('text');
  if(!t.value) return;
  addMsg(t.value);
  t.value='';
}
function addMsg(text){
  let chat=document.getElementById('chat');
  let div=document.createElement('div');
  div.className='msg me';
  div.innerHTML=text+'<br><span class="small">60 sn sonra silinecek</span>';
  chat.appendChild(div);
  chat.scrollTop=chat.scrollHeight;
  setTimeout(()=>{div.remove()},60000);
}
function voice(){
  alert('Sesli mesaj özelliği yakında! 🎤');
}
document.getElementById('text').addEventListener('keydown',e=>{
  if(e.key==='Enter') send();
});
</script>
</body>
</html>
