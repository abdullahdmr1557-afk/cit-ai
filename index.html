<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Çıt Chat</title><style>body{margin:0;font-family:Arial;background:#FF7F00}#login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;padding:20px}.box{background:#fff;padding:20px;border-radius:20px;width:100%;max-width:320px}input{width:100%;padding:15px;border:1px solid #ddd;border-radius:12px;box-sizing:border-box}button{width:100%;padding:15px;background:#000;color:#fff;border:none;border-radius:12px;margin-top:10px;font-size:17px;font-weight:800}#list,#chat{display:none}#list{background:#fff;min-height:100vh}.item{display:flex;gap:10px;padding:15px;border-bottom:1px solid #eee}#chat{flex-direction:column;height:100vh;background:#FFF8E1}.msgs{flex:1;overflow:auto;padding:10px}.msg{padding:10px;border-radius:12px;margin:5px 0;max-width:85%;white-space:pre-wrap}.me{background:#FF7F00;color:#fff;margin-left:auto}.other{background:#fff}.bar{display:flex;gap:5px;padding:10px;background:#fff}.bar input{flex:1}.bar button{width:50px}</style></head><body>
<div id="login"><div style="font-size:100px">🐦</div><h1 style="font-size:50px;margin:0">Çıt Chat</h1><p>Arkadaşlarınla konuş, coin kazan!</p><div style="background:rgba(0,0,0,.3);padding:8px 15px;border-radius:20px">🟢 Şu an <b>1.240</b> kişi çevrimiçi</div><div class="box"><input id="ad" placeholder="Adın ne?"><button onclick="basla()">🚀 Sohbete Başla</button><p style="font-size:12px;color:#888">🪙 Her mesaj +5 Çıt Coin • 🧠 Yeni Zeki AI</p></div></div>
<div id="list"><h1 style="padding:15px">Sohbetler 🟢 1.240 çevrimiçi</h1><div class="item" onclick="ac()"><span style="font-size:30px">🐦</span><div><b>Çıt AI 🧠</b><br><small>Çevrimiçi • Artık çok zekiyim!</small></div></div><div class="item" onclick="ac()"><span style="font-size:30px">🌍</span><div><b>Dünya Sohbeti 🌍</b><br><small>1.240 kişi burada!</small></div></div></div>
<div id="chat"><div style="background:#fff;padding:12px;display:flex;gap:10px;align-items:center"><span onclick="geri()" style="font-size:24px">←</span><b>Çıt AI 🧠</b><span id="coin" style="margin-left:auto;background:#FFF3CD;padding:5px 10px;border-radius:20px">🪙 0</span></div><div class="msgs" id="msgs"></div><div class="bar"><input id="mesaj" placeholder="Bana her şeyi sor..."><button onclick="gonder()">➤</button></div></div>
<script>
var adim="",coin=0;
var alfabe="A,B,C,Ç,D,E,F,G,Ğ,H,I,İ,J,K,L,M,N,O,Ö,P,R,S,Ş,T,U,Ü,V,Y,Z".split(",");
function basla(){var v=document.getElementById('ad').value;if(v==""){alert("Adını yaz kral!");return}adim=v;document.getElementById('login').style.display='none';document.getElementById('list').style.display='block';}
function ac(){document.getElementById('list').style.display='none';document.getElementById('chat').style.display='flex';document.getElementById('msgs').innerHTML='<div class="msg other">Selam '+adim+'! Ben yeni Çıt AI 🐦🧠\nArtık mal değilim, çok zekiyim!\nBana sor: D harfi kaçıncı? Türkiye nedir? 2+2 kaç? Kimsin sen?</div>';}
function geri(){document.getElementById('chat').style.display='none';document.getElementById('list').style.display='block';}
async function gonder(){var i=document.getElementById('mesaj');var t=i.value.trim();if(t=="")return;var m=document.getElementById('msgs');m.innerHTML+='<div class="msg me">'+t+'</div>';i.value="";coin+=5;document.getElementById('coin').innerText='🪙 '+coin;var s=t.toLowerCase();var cevap="";
if(s.includes("mal")||s.includes("salak")||s.includes("aptal")||s.includes("gerizekal")){cevap="Yok be kral, artık mal değilim 😤 Beni yükselttin, şimdi çok zekiyim! Bir daha dene, her şeyi biliyorum 🧠"; }
else if(s.includes("kimsin")||s.includes("adın ne")||s.includes("ismin ne")){cevap="Ben Çıt AI'yım 🐦🧠 Dünyanın en hızlı kuşuyum! İnternetten araştırıp sana cevap veriyorum. Sahibim "+adim+" kral! 👑";}
else if(s.includes("selam")||s.includes("merhaba")||s.includes("hey")||s=="sa"){cevap="Selam "+adim+"! Hoş geldin kral 👑 Bugün ne öğrenelim?";}
else if(s.includes("nasılsın")||s.includes("naber")||s.includes("napıyorsun")){cevap="Çok iyiyim kral, beynimi yeniledin ya uçuyorum 😎 Sen nasılsın?";}
else if(s.includes("seviyor")){cevap="Tabii ki seviyorum seni kral ❤️ Sen benim en iyi arkadaşımsın!";}
else if(s.includes("coin")){cevap="🪙 Coinin: "+coin+" Her mesaj +5! 100 olunca efsane rozet vereceğim 👑";}
else if(s.includes("fıkra")||s.includes("espri")){var f=["Temel'e sormuşlar: En hızlı kuş ne? Temel: Çıt! Çünkü hem uçuyor hem konuşuyor 😂","Bir gün D harfi A'ya demiş: Sen 1.sin ama ben 5.yim, daha büyüğüm 😎","Adamın biri Google'a 'ben mal mıyım' yazmış, Google: 'Çıt AI'ya sor' demiş 😂"];cevap=f[Math.floor(Math.random()*f.length)];}
else if(s.length==1){var h=s.toUpperCase();var idx=alfabe.indexOf(h);if(idx>=0){cevap="🔤 "+h+" harfi Türk alfabesinin "+(idx+1)+". harfidir kral! Alfabemizde toplam 29 harf var. "+h+" harfinden önce "+(idx>0?alfabe[idx-1]:"yok")+", sonra "+(idx<28?alfabe[idx+1]:"yok")+" gelir. 🐦";}else if(!isNaN(s)){cevap="🔢 "+s+" bir rakamdır kral! Tek başına bir sayı. Onun karesi "+(s*s)+" olur. Başka bir şey sor? 😎";}else{cevap="Tek bir '"+t+"' gönderdin kral 😅 Bununla ne yapmamı istiyorsun? Biraz daha açık sor!";}}
else if(s.includes("harfi")&&s.includes("kaçıncı")){var harf=t.replace(/[^a-zA-ZçÇğĞıİöÖşŞüÜ]/g,"").toUpperCase().slice(-1);var idx2=alfabe.indexOf(harf);if(idx2>=0)cevap="🔤 "+harf+" harfi Türk alfabesinin "+(idx2+1)+". harfidir! Eminim, yanlış söylemiyorum 🧠"; }
else if(s.match(/(\d+)\s*[\+\-\*x\/]\s*(\d+)/)){try{var sonuc=eval(s.match(/(\d+)\s*[\+\-\*x\/]\s*(\d+)/)[0].replace("x","*"));cevap="🧮 "+t+" = "+sonuc+" kral! Matematiğim de çok iyi 😎 Başka işlem var mı?";}catch(e){}}
else if(s.includes("ataturk")||s.includes("atürk")){cevap="🌐 Mustafa Kemal Atatürk: Türkiye Cumhuriyeti'nin kurucusu ve ilk Cumhurbaşkanı. 1881 Selanik doğumlu. 19 Mayıs 1919'da Samsun'a çıkarak Kurtuluş Savaşı'nı başlattı. 🇹🇷";}
else if(s.includes("türkiye")||s=="turkiye"){cevap="🌐 Türkiye: Başkenti Ankara, en büyük şehri İstanbul. Nüfusu yaklaşık 85 milyon. 783.562 km² yüzölçümü var. Para birimi Türk Lirası 🇹🇷";}
else if(s.includes("istanbul")){cevap="🌐 İstanbul: Türkiye'nin en büyük şehri, 15 milyondan fazla nüfusu var. Hem Avrupa hem Asya kıtasında! Boğaz Köprüsü, Ayasofya, Galata Kulesi burada 😍";}
else if(s.includes("uzay")){cevap="🌌 Uzay: Sonsuz boşluk! Güneş Sistemi, galaksiler, kara delikler var. Işık saniyede 300.000 km hızla gider. En yakın yıldız Güneş ☀️";}
else if(s.includes("kedi")){cevap="🐱 Kediler: Dünyanın en tatlı hayvanı! Günde 12-16 saat uyurlar. 230'dan fazla kemiği var. Mırlama sesiyle insanı sakinleştirirler ❤️";}
else if(s.includes("köpek")){cevap="🐶 Köpekler: İnsanın en sadık dostu! 300 milyon koku alma hücresi var. Ortalama 10-13 yıl yaşarlar. En zekisi Border Collie 🧠";}
else if(s.includes("dünya")||s.includes("dunya")){cevap="🌍 Dünya: Yaşadığımız gezegen! Yaşı 4,5 milyar yıl. %71'i suyla kaplı. 8 milyar insan yaşıyor. Tek bildiğimiz yaşam olan gezegen!";}
else if(s.includes("güneş")||s.includes("gunes")){cevap="☀️ Güneş: Bizim yıldızımız! 1,4 milyon km çapında. 15 milyon derece sıcak. Işığı bize 8 dakikada ulaşır!";}
else if(s.includes("ay ")){cevap="🌙 Ay: Dünyanın tek doğal uydusu. 1969'da ilk insan Neil Armstrong ayak bastı. Dünyadan 384.400 km uzakta!";}
else if(s.includes("su ")||s=="su nedir"){cevap="💧 Su: H2O! Hayatın kaynağı. İnsan vücudunun %60'ı su. 100 derecede kaynar, 0 derecede donar!";}
else if(s.includes("hava")||s.includes("yağmur")){cevap="🌧️ Hava durumu için en iyisi telefonundan bak kral, ben internetten anlık bakamıyorum ama bugün İstanbul'da hava genelde güzel 😎";}
else if(s.includes("ne yap")||s.includes("sıkıldım")||s.includes("canım sık")){cevap="Sıkıldıysan sana bir oyun söyleyeyim kral 😎 Bana 'fıkra anlat' de, ya da 'D harfi kaçıncı' diye sor, ya da en sevdiğin hayvanı sor!";}
if(cevap!=""){m.innerHTML+='<div class="msg other">'+cevap+'</div>';m.scrollTop=99999;return;}
var y=document.createElement('div');y.className='msg other';y.innerText="İnternette arıyorum... 🌐🔍";m.appendChild(y);m.scrollTop=99999;try{var temiz=t.replace(/nedir\?|kimdir\?|nedir|kimdir|ne demek|kaçıncı| nedir| kimdir/g,"").trim();if(temiz=="")temiz=t;var q=encodeURIComponent(temiz);var r=await fetch('https://tr.wikipedia.org/w/api.php?action=query&list=search&srsearch='+q+'&format=json&origin=*&srlimit=1');var j=await r.json();if(j.query && j.query.search.length>0){var baslik=j.query.search[0].title;var r2=await fetch('https://tr.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(baslik));var j2=await r2.json();if(j2.extract){y.innerText="🌐 İnternetten buldum kral:\n\n"+j2.extract+"\n\n📚 Kaynak: Wikipedia - "+baslik;return;}}var r3=await fetch('https://api.duckduckgo.com/?q='+q+'&format=json&no_html=1&skip_disambig=1');var j3=await r3.json();if(j3.AbstractText){y.innerText="🌐 İnternetten buldum kral:\n\n"+j3.AbstractText;return;}y.innerText="Kral bunu bulamadım ama sen bana öğret, ben de öğreneyim 🐦🧠 Başka bir şekilde sorar mısın? Mesela '"+temiz+" nedir?' diye sor!";}catch(e){y.innerText="İnternet biraz yavaşladı kral, tekrar dene 🌐";}}
</script></body></html>
