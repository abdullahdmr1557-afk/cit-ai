<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Çıt Chat</title><style>body{margin:0;font-family:Arial;background:#ffe8c9}header{background:#111;color:#fff;padding:10px;display:flex;gap:10px;align-items:center}header img{width:50px;height:50px;border-radius:50%;border:3px solid #ff7a00;background:#fff}.btn{background:#ff7a00;color:#fff;border:none;padding:12px;border-radius:20px;font-weight:bold;margin:4px}.box{background:#fff;margin:10px;border-radius:16px;padding:14px;text-align:center}#chat{padding:12px;display:flex;flex-direction:column;gap:10px;min-height:400px}.m{padding:11px 14px;border-radius:16px;font-weight:bold;max-width:85%;font-size:15px}.u{background:#ff7a00;color:#fff;align-self:flex-end}.b{background:#111;color:#fff;align-self:flex-start}.small{font-size:11px;opacity:.8;margin-top:4px}#box{display:flex;padding:10px;gap:6px;position:fixed;bottom:0;left:0;right:0;background:#ffe8c9}#inp{flex:1;padding:13px;border-radius:25px;border:2px solid #111}input[type=text]{padding:12px;border-radius:15px;border:2px solid #111;width:80%}.friend{background:#fff;margin:8px;border-radius:16px;padding:12px;display:flex;gap:10px;align-items:center;cursor:pointer}.friend img{width:48px;height:48px;border-radius:50%;border:3px solid #ff7a00}.topbar{background:#111;color:#fff;padding:14px;display:flex;justify-content:space-between;align-items:center}.fab{background:#ff7a00;color:#fff;border:none;width:55px;height:55px;border-radius:50%;font-size:28px;position:fixed;bottom:20px;right:20px;box-shadow:0 4px 10px rgba(0,0,0,.3)}</style></head><body>

<div id="home">
<div class="topbar"><b style="font-size:20px">🐦 Çıt Chat</b><span>🔍 ⋮</span></div>
<div style="padding:10px"><b>Adın:</b> <input id="myname" type="text" placeholder="Adını yaz" style="width:60%"></div>
<div id="friends"></div>
<button class="fab" onclick="addFriend()">+</button>
<p style="text-align:center;font-size:11px;color:#888">Tüm mesajlar 60 sn sonra silinir 🔒</p>
</div>

<div id="app" style="display:none">
<header><button class="btn" onclick="back()">←</button><img src="cit.png"><div style="flex:1"><b id="chatName">Sohbet</b><br><span style="font-size:12px;color:#ff7a00" id="chatSub">Çevrimiçi • Mesajlar 60sn sonra silinir</span></div><button class="btn">📞</button></header>
<div id="chat"></div><div style="height:80px"></div>
<div id="box"><input id="inp" placeholder="Mesaj yaz..."><button class="btn" onclick="sendReal()">➤</button></div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import {getDatabase,ref,push,onChildAdded,remove} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";
const firebaseConfig={apiKey:"BURAYA_APIKEY",authDomain:"cit-chat.firebaseapp.com",databaseURL:"https://cit-chat-default-rtdb.firebaseio.com",projectId:"cit-chat",storageBucket:"cit-chat.appspot.com",messagingSenderId:"123456",appId:"1:123:web:abc"};
let db,myName="",room="",isBot=false,currentFriend="";
let friends=JSON.parse(localStorage.getItem('cit_friends')||'[]');
window.renderFriends=()=>{let f=document.getElementById('friends');if(friends.length==0){f.innerHTML=`<div style="text-align:center;padding:40px 20px;color:#888"><div style="font-size:60px">🐦</div><h3>Henüz kimse yok</h3><p>Alttaki <b>+</b> tuşuna basıp<br>istediğin kadar kişi ekleyebilirsin!</p></div>`;return}let html=`<div style="padding:8px"><b>👥 Kişiler (${friends.length})</b></div>`;html+=friends.map((x,i)=>`<div class="friend" onclick="openFriend('${x.name}','${x.room}')"><img src="cit.png"><div style="flex:1"><b>${x.name}</b><br><span style="font-size:12px;color:#888">Oda: ${x.room} • Dokun, konuş!</span></div><span onclick="event.stopPropagation();delFriend(${i})">🗑️</span></div>`).join('');html+=`<div class="friend" onclick="openBot()"><img src="cit.png"><div style="flex:1"><b>🤖 Çıt (Yapay Zeka)</b><br><span style="font-size:12px;color:#888">Merhaba size nasıl yardımcı olabilirim</span></div></div>`;f.innerHTML=html};
renderFriends();
window.addFriend=()=>{let n=prompt('Kişinin adı ne?');if(!n)return;let r=prompt(n+' ile ortak Oda Kodu ne olsun? İkiniz de aynı kodu kullanın:');if(!r)return;friends.push({name:n,room:r.toUpperCase()});localStorage.setItem('cit_friends',JSON.stringify(friends));renderFriends();alert(n+' eklendi! ✅')};
window.delFriend=(i)=>{if(confirm(friends[i].name+' silinsin mi?')){friends.splice(i,1);localStorage.setItem('cit_friends',JSON.stringify(friends));renderFriends()}};
window.openFriend=(n,r)=>{myName=document.getElementById('myname').value.trim();if(!myName){alert('Önce en üstte Adını yaz!');return}currentFriend=n;room=r;isBot=false;document.getElementById('home').style.display='none';document.getElementById('app').style.display='block';document.getElementById('chatName').innerText=n;document.getElementById('chat').innerHTML='';try{const app=initializeApp(firebaseConfig);db=getDatabase(app);let rf=ref(db,'rooms/'+room);onChildAdded(rf,snap=>{let d=snap.val();if(d.sender!==myName)addMsg(d.text,false,d.sender,snap.key)});}catch(e){}};
window.openBot=()=>{isBot=true;document.getElementById('home').style.display='none';document.getElementById('app').style.display='block';document.getElementById('chatName').innerText='Çıt';document.getElementById('chat').innerHTML='';addMsg('Merhaba size nasıl yardımcı olabilirim',false)};
window.back=()=>{document.getElementById('app').style.display='none';document.getElementById('home').style.display='block';isBot=false};
window.addMsg=(t,me,sender,key)=>{let c=document.getElementById('chat');let d=document.createElement('div');d.className='m '+(me?'u':'b');d.innerHTML=t+`<div class="small">${sender?sender+' • ':''}<span style="color:#ff7a00">⏱ 60 sn sonra silinecek</span></div>`;c.appendChild(d);c.scrollTop=c.scrollHeight;if(key){setTimeout(()=>{d.remove();remove(ref(db,'rooms/'+room+'/'+key))},60000)}};
window.sendReal=()=>{let i=document.getElementById('inp');let t=i.value.trim();if(!t)return;if(isBot){addMsg(t,true);i.value='';setTimeout(()=>{let k=t.toLowerCase();if(k.includes('selam')||k.includes('merhaba'))addMsg('Merhaba size nasıl yardımcı olabilirim',false);else if(k.includes('güncelleme'))addMsg('Güncellemeler çok yakında gelecek!',false);else{let r=['Anladığımdan emin değilim, biraz daha açar mısın? 🐦','Çok üzgünüm anlayamıyorum... Tekrar söyler misin?','Anladığımdan emin değilim... Güncellemeler çok yakında gelecek!'];addMsg(r[Math.floor(Math.random()*r.length)],false)}},600);return}addMsg(t,true,'Sen');try{push(ref(db,'rooms/'+room),{text:t,sender:myName,time:Date.now()})}catch(e){}i.value=''};
document.getElementById('inp').addEventListener('keydown',e=>{if(e.key==='Enter')sendReal()});
</script></body></html>
