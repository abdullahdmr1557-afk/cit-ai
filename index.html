<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:Arial;background:#e8f5e9}header{background:#111;color:#fff;padding:15px;text-align:center}#chat{padding:15px}.msg{background:#fff;padding:10px;border-radius:10px;margin:5px}</style></head><body><header>🐦 TEST</header><div id="chat"></div><script>
var chat=document.getElementById("chat");
function ekle(t){var d=document.createElement("div");d.className="msg";d.innerText=t;chat.appendChild(d)}
ekle("Selam! Bu mesaj çıkıyorsa kod çalışıyor demektir!");
ekle("Şimdi bana Hey yaz, bak cevap vereceğim");
</script></body></html>
