<!<!DOCTYPE html>
<!DOCTYPE html>
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Çıt Chat - Süper Zeka</title>
<style>
body{margin:0;font-family:Arial;background:#e8f5e9}
header{background:#4CAF50;color:white;padding:15px;text-align:center;font-size:22px;font-weight:bold}
#chat{height:70vh;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:80%;padding:10px 14px;border-radius:15px}
.user{background:#DCF8C6;align-self:flex-end}
.bot{background:white;align-self:flex-start}
#box{display:flex;padding:10px;background:white;position:fixed;bottom:0;width:100%;box-sizing:border-box}
#inp{flex:1;padding:12px;border-radius:20px;border:1px solid #ccc;outline:none}
#btn{background:#4CAF50;color:white;border:none;padding:12px 18px;border-radius:20px;margin-left:8px}
</style>
</head>
<body>
<header>🐦 Çıt Chat - Süper Zeka</header>
<div id="chat"></div>
<div id="box"><input id="inp" placeholder="Bir şey yaz..."><button id="btn" onclick="send()">Gönder</button></div>
<script>
let chat=document.getElementById("chat");
let inp=document.getElementById("inp");
let userName=""; let favTeam=""; let favGame=""; let puan=0;
let oyunModu=""; let tutulanSayi=0; let matematikCevap=0; let ingilizceCevap="";
function addMsg(tip,who){let d=document.createElement("div");d.className="msg "+who;d.innerText=tip;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;}
function rastgeleSec(l){return l[Math.floor(Math.random()*l.length)];}
function send(){
let y=inp.value.trim(); if(!y) return;
addMsg(y,"user"); inp.value="";
let k=y.toLowerCase();
let cevap="";

// OYUN MODU - Sayı Tahmin
if(oyunModu=="sayi"){
  let tahmin=parseInt(y);
  if(tahmin==tutulanSayi){ puan+=10; cevap="BİLDİN!! 🎉 +10 puan! Puanın: "+puan+" Bir daha oynayalım mı? 'oyun' yaz!"; oyunModu=""; }
  else if(tahmin<tutulanSayi){ cevap="Daha BÜYÜK söyle! ⬆️ Tekrar dene:"; }
  else { cevap="Daha KÜÇÜK söyle! ⬇️ Tekrar dene:"; }
  setTimeout(()=>addMsg(cevap,"bot"),400); return;
}
// OYUN MODU - Matematik
if(oyunModu=="matematik"){
  if(parseInt(y)==matematikCevap){ puan+=10; cevap="DOĞRU! 🧠 +10 puan! Puanın: "+puan+" Başka soru için 'matematik sor' yaz!"; }
  else { cevap="Olmadı be, doğru cevap "+matematikCevap+" idi. Bir daha dene, 'matematik sor' yaz!"; }
  oyunModu=""; setTimeout(()=>addMsg(cevap,"bot"),400); return;
}
// OYUN MODU - İngilizce
if(oyunModu=="ingilizce"){
  if(k==ingilizceCevap){ puan+=10; cevap="Perfect! 🇬🇧 +10 puan! Puanın: "+puan+" Devamı için 'ingilizce' yaz!"; }
  else { cevap="Olmadı, doğrusu '"+ingilizceCevap+"' idi. Bir daha dene!"; }
  oyunModu=""; setTimeout(()=>addMsg(cevap,"bot"),400); return;
}

if(!userName && (k.includes("adım")||k.includes("ben "))){
  let kelimeler=y.split(" "); userName=kelimeler[kelimeler.length-1];
  cevap="Memnun oldum "+userName+"! Seni artık hatırlayacağım 😄 Hangi takımlısın?"; 
}
else if(k.includes("selam")||k.includes("merhaba")||k.includes("hey")) cevap=rastgeleSec(["Selam"+(userName?" "+userName:"")+"! Hoş geldin 🐦 Bugün nasıl geçti?","Heyy hoş geldin! Naber, ne yapıyorsun? 😄","Selam! Seni görmek çok güzel, anlat bakalım bugün ne yaptın?"]);
else if(k.includes("nasılsın")||k.includes("naber")) cevap="İyiyim, sen sorunca daha iyi oldum 😄 Sen nasılsın? Puanın: "+puan;
else if(k.includes("kimsin")||k.includes("adın ne")) cevap="Ben Çıt Chat'im 🐦 Süper Zeka oldum! Adını, takımını, oyununu hatırlıyorum. Senin adın ne?";
else if(k.includes("benim en sevdiğim")||k.includes("ne seviyorum")||k.includes("hatırlıyor musun")) cevap="Tabii hatırlıyorum! Adın "+(userName||"bilmiyorum")+", takımın "+(favTeam||"henüz söylemedin")+", sevdiğin oyun "+(favGame||"henüz söylemedin")+". Puanın da "+puan+" 🧠";
else
