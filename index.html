<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cit Chat</title>
<style>
body{margin:0;font-family:Arial;background:#FFEFD5}
#welcome{min-height:100vh;background:white;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
#welcome img{width:140px;height:140px;border-radius:50%;object-fit:cover;border:4px solid #ff7a00}
#welcome h1{font-size:42px;margin:10px 0 0}
.slogan{color:#ff7a00;font-weight:bold;font-size:22px}
#welcome input{width:90%;max-width:350px;padding:15px;border-radius:14px;border:2px solid black;font-size:16px;margin-top:20px}
#welcome button{width:90%;max-width:350px;background:#ff7a00;color:white;border:none;padding:16px;border-radius:14px;font-size:22px;font-weight:bold;margin-top:14px}
#home{display:none}
.topbar{background:black;color:white;padding:12px;display:flex;justify-content:space-between}
.fabCit{position:fixed;bottom:20px;left:18px;width:72px;height:72px;border-radius:50%;border:4px solid white;overflow:hidden;padding:0}
.fabCit img{width:100%;height:100%;object-fit:cover}
.fabPlus{position:fixed;bottom:20px;right:18px;width:68px;height:68px;background:#ff7a00;border-radius:50%;border:none;color:white;font-size:36px}
.chat-item{display:flex;gap:12px;padding:12px;background:white;margin:10px 16px;border-radius:16px}
.avatar{width:54px;height:54px;border-radius:50%;background:#ff7a00;display:flex;align-items:center;justify-content:center;font-size:28px}
#chatPage{display:none}
header{background:black;color:white;padding:10px;display:flex;gap:10px;align-items:center}
#chat{padding:12px;display:flex;flex-direction:column;gap:10px;padding-bottom:90px}
.m{padding:11px 14px;border-radius:16px;font-weight:bold;max-width:85%}
.u{background:#ff7a00;color:white;align-self:flex-end}
.b{background:black;color:white;align-self:flex-start}
#box{display:flex;padding:10px;gap:6px;position:fixed;bottom:0;left:0;right:0;background:white}
#inp{flex:1;padding:13px;border-radius:25px;border:2px solid black}
.btn{background:#ff7a00;color:white;border:none;padding:12px;border-radius:20px;font-weight:bold}
</style>
</head>
<body>

<div id="welcome">
<img src="cit.png">
<h1>Cit Chat</h1>
<div class="slogan">Konus, citla, silins
