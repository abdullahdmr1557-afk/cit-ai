<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Çıt Chat</title><style>body{margin:0;font-family:Arial;background:#FF7F00}#login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;padding:20px}.box{background:#fff;padding:20px;border-radius:20px;width:100%;max-width:320px}input{width:100%;padding:15px;border:1px solid #ddd;border-radius:12px;box-sizing:border-box}button{width:100%;padding:15px;background:#000;color:#fff;border:none;border-radius:12px;margin-top:10px;font-size:17px;font-weight:800}#list,#chat{display:none}#list{background:#fff;min-height:100vh}.item{display:flex;gap:10px;padding:15px;border-bottom:1px solid #eee}#chat{flex-direction:column;height:100vh;background:#FFF8E1}.msgs{flex:1;overflow:auto;padding:10px}.msg{padding:10px;border-radius:12px;margin:5px 0;max-width:80%;white-space:pre-wrap}.me{background:#FF7F00;color:#fff;margin-left:auto}.other{background:#fff}.bar{display:flex;gap:5px;padding:10px;background:#fff}.bar input{flex:1}.bar button{width:50px}</style></head><body>
<div id="login"><div style="font-size:100px">🐦</div><h1 style="font-size:50px;margin:0">Çıt Chat</h1><p>Arkadaşlarınla konuş, coin kazan!</p><div style="background:rgba(0,0,0,.3);padding:8px 15px;border-radius:20px">🟢 Şu an <b>1.240</b> kişi çevrimiçi</div><div class="box"><input id="ad" placeholder="Adın ne?"><button onclick="basla()">🚀 Sohbete Başla</button><p style="font-size:12px;color:#888">🪙 Her mesaj +5 Çıt Coin • 🌐 İnternetli AI</p></div></div>
<div id="list"><h1 style="padding:15px">Sohbetler 🟢 1.240 çevrimiçi</h1><div class="item" onclick="ac()"><span style="font-size:30px">🐦</span><div><b>Çıt AI 🌐</b><br><small>Çevrimiçi • İnternetten cevap veririm!</small></div></div><div class="item" onclick="ac()"><span style="font-size:30px">👧</span><div><b>Ayşe Elif</b><br><small>Selam!</small></div></div><div class="item" onclick="ac()"><span style="font-size:30px">🌍</span><div><b>Dünya Sohbeti 🌍</b><br><small>1.240 kişi burada!</small></div></div></div>
<div id="chat"><div style="background:#fff;padding:12px;display:flex;gap:10px;align-items:center"><span onclick="geri()" style="font-size:24px">←</span><b>Çıt AI</b><span id="coin" style="margin-left:auto;background:#FFF3CD;padding:5px 10px;border-radius:20px">🪙 0</span></div><div class="msgs" id="msgs"></div><div class="bar"><input id="mesaj" placeholder="İnternete sor..."><button onclick="gonder()">➤</button></div></div>
<script>
var adim="",coin=0;
function basla(){var v=document.getElementById('ad').value;if(v==""){alert("Adını yaz kral!");return}adim=v;document.getElementById('login').style.display='none';document.getElementById('list').style.display='block';}
function ac(){document.getElementById('list').style.display='none';document.getElementById('chat').style.display='flex';document.getElementById('msgs').innerHTML='<div class="msg other">Selam '+adim+'! Ben Çıt AI 🐦🌐\n🟢 1.240 kişi çevrimiçi!\nBana her şeyi sor, internetten bulayım!\nÖrn: Türkiye nedir? Kediler nedir? Uzay nedir?</div>';}
function geri(){document.getElementById('chat').style.display='none';document.getElementById('list').style.display='block';}
async function gonder(){var i=document.getElementById('mesaj');var t=i.value;if(t=="")return;var m=document.getElementById('msgs');m.innerHTML+='<div class="msg me">'+t+'</div>';i.value="";coin+=5;document.getElementById('coin').innerText='🪙 '+coin;var s=t.toLowerCase();var c="";if(s.includes("selam")||s.includes("merhaba"))c="Selam "+adim+"! Hoş geldin kral 👑";else if(s.includes("fıkra"))c="Temel demiş ki: En sevdiğim kuş Çıt! Çünkü hep konuşuyor 😂";else if(s.includes("coin"))c="🪙 Coinin: "+coin+" Her mesaj +5!";else if(s.includes("nasılsın")||s.includes("naber"))c="İyiyim kral, internette geziyorum 😎 Sen nasılsın?";else if(s.includes("seviyor"))c="Tabii ki seviyorum seni kral ❤️";else if(s.includes("ataturk")||s.includes("atürk"))c="🌐 Atatürk: Türkiye Cumhuriyeti'nin kurucusu, 1881 Selanik doğumlu büyük lider! 🇹🇷";else{var y=document.createElement('div');y.className='msg other';y.innerText="İnternette arıyorum... 🌐🔍";m.appendChild(y);m.scrollTop=99999;try{var q=encodeURIComponent(t.replace("?",""));var r=await fetch('https://tr.wikipedia.org/w/api.php?action=query&list=search&srsearch='+q+'&format=json&origin=*&srlimit=1');var j=await r.json();if(j.query.search.length>0){var baslik=j.query.search[0].title;var r2=await fetch('https://tr.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(baslik));var j2=await r2.json();if(j2.extract){y.innerText="🌐 İnternetten buldum kral:\n\n"+j2.extract+"\n\n📚 Kaynak: Wikipedia - "+baslik;return;}}y.innerText="Kral bunu internette tam bulamadım ama çok ilginç bir soru! Başka bir şekilde sorar mısın? 🐦";}catch(e){y.innerText="İnternet hatası oldu kral, tekrar dene 🌐";}return;}m.innerHTML+='<div class="msg other">'+c+'</div>';m.scrollTop=99999;}
</script></body></html>
