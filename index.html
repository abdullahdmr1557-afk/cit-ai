<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Çıt Chat - Süper Zeka</title>
<style>
body{margin:0;font-family:Arial;background:#e8f5e9}
header{background:#4CAF50;color:white;padding:15px;text-align:center;font-size:22px;font-weight:bold}
#chat{height:70vh;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:10px;padding-bottom:90px}
.msg{max-width:80%;padding:10px 14px;border-radius:15px;word-wrap:break-word}
.user{background:#DCF8C6;align-self:flex-end}
.bot{background:white;align-self:flex-start}
#box{display:flex;padding:10px;background:white;position:fixed;bottom:0;left:0;right:0;box-sizing:border-box;z-index:99}
#inp{flex:1;padding:12px;border-radius:20px;border:1px solid #ccc;outline:none;font-size:16px}
#btn{background:#4CAF50;color:white;border:none;padding:12px 20px;border-radius:20px;margin-left:8px;font-size:16px;font-weight:bold}
</style>
</head>
<body>
<header>🐦 Çıt Chat - Süper Zeka</header>
<div id="chat"></div>
<div id="box"><input id="inp" placeholder="Bir şey yaz..."><button id="btn" type="button">Gönder</button></div>
