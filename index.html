<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Çıt AI Pro Max</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#e8f5e9;height:100dvh;display:flex;flex-direction:column}header{background:#111;color:#fff;padding:14px;text-align:center;font-size:21px;font-weight:bold}#chat{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:10px}.msg{max-width:84%;padding:11px 14px;border-radius:16px;line-height:1.45}.user{background:#DCF8C6;align-self:flex-end}.bot{background:#fff;align-self:flex-start}.msg img{width:100%;border-radius:12px;margin-top:6px}#hiz{display:flex;gap:6px;padding:8px;overflow-x:auto;background:#fff;border-top:1px solid #ddd}#hiz button{background:#E8F5E9;border:1px solid #4CAF50;padding:10px 14px;border-radius:20px;white-space:nowrap;font-weight:bold;font-size:15px}#box{display:flex;padding:10px;background:#fff;border-top:2px solid #111;gap:8px;padding-bottom:18px}#inp{flex:1;padding:16px;border-radius:25px;border:2px solid #111;font-size:17px;outline:none}#btn{background:#111;color:#fff;border:none;padding:16px 22px;border-radius:25px;font-weight:bold;font-size:16px}</style></head><body><header>🐦 Çıt AI PRO MAX</header><div id="chat"><div class="msg bot">Selam! Ben Çıt AI PRO MAX! 😎 Altta Messi'ye bas ya da yaz: Messi fotoğrafı</div></div><div id="hiz"><button onclick="hizli('Messi fotoğrafı')">⚽ Messi</button><button onclick="hizli('Ronaldo fotoğrafı')">⚽ Ronaldo</button><button onclick="hizli('Icardi fotoğrafı')">🦁 Icardi</button><button onclick="hizli('MrBeast fotoğrafı')">🌟 MrBeast</button><button onclick="hizli('hava durumu')">🌦️ Hava</button><button onclick="hizli('film öner')">🎬 Film</button><button onclick="hizli('oyun')">🎮 Oyun</button></div><div id="box"><input id="inp" type="text" placeholder="Buraya yaz..."><button id="btn" onclick="gonder()">Gönder</button></div><script>
var ad="",puan=0,mod="",sayi=0,mat=0,bil="",og={};
function ekle(t,w){var c=document.getElementById("chat");var d=document.createElement("div");d.className="msg "+w;d.innerText=t;c.appendChild(d);c.scrollTop=99999}
function foto(t,u,a){var c=document.getElementById("chat");var d=document.createElement("div");d.className="msg bot";d.innerText=t;var i=document.createElement("img");i.src=u;d.appendChild(i);if(a){var p=document.createElement("div");p.innerText=a;p.style.fontSize="13px";d.appendChild(p)}c.appendChild(d);c.scrollTop=99999}
function sec(l){return l[Math.floor(Math.random()*l.length)]}
function hizli(t){document.getElementById("inp").value=t;gonder()}
function cv(c){var ch=document.getElementById("chat");var y=document.createElement("div");y.className="msg bot";y.innerText="Çıt yazıyor...";ch.appendChild(y);setTimeout(function(){y.remove();ekle(c,"bot")},500)}
function unlu(isim){cv("Bakıyorum, "+isim+" geliyor...");fetch("https://en.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(isim)).then(function(r){return r.json()}).then(function(j){if(j.thumbnail&&j.thumbnail.source){foto("İşte "+isim+"! 🌟",j.thumbnail.source,"")}else{foto("İşte fotoğraf:","https://picsum.photos/400/300?r="+Math.random())}}).catch(function(){foto("İşte fotoğraf:","https://picsum.photos/400/300?r="+Math.random())})}
function hava(){cv("Havaya bakıyorum...");fetch("https://api.open-meteo.com/v1/forecast?latitude=41&longitude=28.9&current=temperature_2m&timezone=Europe%2FIstanbul").then(function(r){return r.json()}).then(function(j){ekle("İstanbul: "+j.current.temperature_2m+"°C 🌦️","bot")}).catch(function(){ekle("Hava güzel gibi!","bot")})}
function gonder(){var inp=document.getElementById("inp");var y=inp.value.trim();if(!y)return;ekle(y,"user");inp.value="";var k=y.toLowerCase();var c="";
if(k.indexOf("hava")>=0){hava();return}
if(k.indexOf("film")>=0){cv(sec(["🎬 Örümcek Adam - Eve Dönüş Yok, efsane!","🎬 Aslan Kral, çok duygusal!","🎬 Harry Potter serisi!"]));return}
if(k.indexOf("sarki")>=0||k.indexOf("şarkı")>=0){cv(sec(["🎵 Semicenk - Geçiyor Zaman","🎵 Tarkan - Şımarık aç dans et!","🎵 Mert Demir - Ateşe Düştüm"]));return}
if(k.indexOf("foto")>=0){var isim=y.replace(/fotoğrafı|fotoğraf|foto/gi,"").trim();if(!isim)isim="kedi";if(isim.toLowerCase()=="kedi"){foto("İşte kedi! 🐱","https://placecats.com/400/300");return}if(isim.toLowerCase()=="köpek"){foto("İşte köpek! 🐶","https://placedog.net/400/300");return}unlu(isim);return}
if(mod=="sayi"){var t=parseInt(y);if(t==sayi){puan+=10;c="BİLDİN! 🎉 +10 Puanın: "+puan;mod=""}else if(t<sayi){c="Daha BÜYÜK söyle!"}else{c="Daha KÜÇÜK söyle!"}cv(c);return}
if(mod=="mat"){if(parseInt(y)==mat){puan+=10;c="DOĞRU! 🧠 +10 Puanın: "+puan}else{c="Olmadı cevap "+mat+" idi."}mod="";cv(c);return}
if(mod=="bil"){if(k.indexOf(bil)>=0){puan+=10;c="Bildin! 🧩 +10"}else{c="Bilemedin! Cevap: "+bil}mod="";cv(c);return}
if(!ad&&k.indexOf("adım")>=0){var pp=y.split(" ");ad=pp[pp.length-1];cv("Memnun oldum "+ad+"! Seni artık hep hatırlayacağım!");return}
if(k.indexOf("selam")>=0||k.indexOf("merhaba")>=0||k.indexOf("hey")>=0)c=sec(["Selam "+ad+"! Hoş geldin, ne yapıyorsun?","Heyy "+ad+"! Seni görmek güzel.","Selam! Nasılsın?"]);
else if(k.indexOf("nasılsın")>=0)c="İyiyim, sen nasılsın? Puanın: "+puan;
else if(k.indexOf("kimsin")>=0)c="Ben Çıt AI PRO MAX'im! 'Messi fotoğrafı' yaz dene!";
else if(k.indexOf("oyun")>=0){sayi=Math.floor(Math.random()*10)+1;mod="sayi";c="Hadi! 🎮 1-10 arası sayı tuttum!"}
else if(k.indexOf("fıkra")>=0)c=sec(["Temel: En sevdiğim ders teneffüs! 😂","Nasrettin Hoca: Erkek adam sözünden dönmez! 😂"]);
else if(k.indexOf("hikaye")>=0)c="Bir varmış bir yokmuş... Küçük kuş Çıt arkadaşlarıyla maceraya çıkmış. En büyük güç arkadaşlıkmış. ❤️";
else if(k.indexOf("bilmece")>=0){var b=[["Hangi ayda 28 gün vardır?","bütün"],["Hangi kuş uçamaz?","penguen"]];var s=sec(b);bil=s[1];mod="bil";c="Bilmece! 🧩 "+s[0]}
else if(k.indexOf("puan")>=0)c="Puanın: "+puan+" ⭐";
else if(k.indexOf("matematik")>=0){var a=Math.floor(Math.random()*20)+1,bb=Math.floor(Math.random()*10)+1;mat=a+bb;mod="mat";c="Matematik! 🧠 "+a+" + "+bb+" kaç?"}
else if(k.indexOf("moral")>=0||k.indexOf("üzgün")>=0)c="Üzülme "+ad+", buradayım. Sen çok değerlisin. ❤️";
else if(k.indexOf("teşekkür")>=0)c="Rica ederim "+ad+"! ❤️";
else if(k.indexOf("bay bay")>=0)c="Görüşürüz "+ad+"! Puanın "+puan+" kaldı. ❤️";
else c=sec(["Vay be anlat biraz daha! Sonra ne oldu?","Hadi ya gerçekten mi? Biraz daha anlat!","Ooo ilginç! Peki sen ne düşünüyorsun?"]);
cv(c)}
</script></body></html>
