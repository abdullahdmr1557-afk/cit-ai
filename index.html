<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Çıt AI Pro Max</title><style>body{margin:0;font-family:Arial;background:#e8f5e9}header{background:linear-gradient(90deg,#111,#4CAF50);color:#fff;padding:14px;text-align:center;font-size:22px;font-weight:bold}#chat{height:70vh;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:10px;padding-bottom:110px}.msg{max-width:84%;padding:11px 14px;border-radius:16px;line-height:1.45}.user{background:#DCF8C6;align-self:flex-end}.bot{background:#fff;align-self:flex-start;box-shadow:0 1px 4px #0002}.msg img{width:100%;border-radius:12px;margin-top:6px}#box{display:flex;padding:10px;background:#fff;position:fixed;bottom:0;left:0;right:0;box-sizing:border-box;z-index:10}#inp{flex:1;padding:13px;border-radius:22px;border:1px solid #ccc;font-size:16px;outline:none}#btn{background:#111;color:#fff;border:none;padding:12px 20px;border-radius:22px;margin-left:8px;font-size:16px;font-weight:bold}#hiz{display:flex;gap:6px;padding:8px;overflow-x:auto;background:#fff;border-top:1px solid #eee;position:fixed;bottom:66px;left:0;right:0;z-index:10}#hiz button{background:#E8F5E9;border:1px solid #4CAF50;color:#222;padding:7px 12px;border-radius:20px;white-space:nowrap;font-weight:bold}</style></head><body><header>🐦 Çıt AI PRO MAX - Adam Gibi</header><div id="chat"></div><div id="hiz"><button onclick="hizli('Messi fotoğrafı')">⚽ Messi</button><button onclick="hizli('Ronaldo fotoğrafı')">⚽ Ronaldo</button><button onclick="hizli('Icardi fotoğrafı')">🦁 Icardi</button><button onclick="hizli('MrBeast fotoğrafı')">🌟 MrBeast</button><button onclick="hizli('hava durumu')">🌦️ Hava</button><button onclick="hizli('film öner')">🎬 Film</button><button onclick="hizli('şarkı öner')">🎵 Şarkı</button><button onclick="hizli('oyun')">🎮 Oyun</button></div><div id="box"><input id="inp" placeholder="Ünlü adı + fotoğrafı yaz... Örn: Messi fotoğrafı"><button id="btn" type="button">Gönder</button></div><script>
var chat=document.getElementById("chat"),inp=document.getElementById("inp"),btn=document.getElementById("btn");
var ad="",takim="",puan=0,mod="",sayi=0,matCevap=0,bilCevap="",ogrenen={};
try{var kayit=JSON.parse(localStorage.getItem("cit"));if(kayit){ad=kayit.ad||"";puan=kayit.puan||0;ogrenen=kayit.ogrenen||{};}}catch(e){}
function kaydet(){localStorage.setItem("cit",JSON.stringify({ad:ad,puan:puan,ogrenen:ogrenen}));}
function ekle(t,w){var d=document.createElement("div");d.className="msg "+w;d.innerText=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;}
function ekleFoto(t,url,aciklama){var d=document.createElement("div");d.className="msg bot";d.innerText=t;var im=document.createElement("img");im.src=url;d.appendChild(im);if(aciklama){var p=document.createElement("div");p.innerText=aciklama;p.style.fontSize="13px";p.style.marginTop="6px";d.appendChild(p);}chat.appendChild(d);chat.scrollTop=chat.scrollHeight;}
function sec(l){return l[Math.floor(Math.random()*l.length)];}
function hizli(t){inp.value=t;gonder();}
function cevapVer(c){var y=document.createElement("div");y.className="msg bot";y.innerText="Çıt yazıyor...";chat.appendChild(y);chat.scrollTop=chat.scrollHeight;setTimeout(function(){y.remove();ekle(c,"bot");},500);}
async function unluFoto(isim){cevapVer("Bakıyorum, "+isim+" fotoğrafı geliyor...");try{var r=await fetch("https://en.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(isim));var j=await r.json();if(j.thumbnail&&j.thumbnail.source){ekleFoto("İşte "+isim+"! 🌟",j.thumbnail.source,j.extract?j.extract.slice(0,250)+"...":"");}else{ekleFoto("İnternette tam bulamadım ama işte rastgele bir fotoğraf:", "https://picsum.photos/400/300?random="+Math.floor(Math.random()*1000));}}catch(e){ekleFoto("İşte sana fotoğraf:", "https://picsum.photos/400/300?random="+Math.floor(Math.random()*1000));}}
async function hava(){cevapVer("Havaya bakıyorum...");try{var r=await fetch("https://api.open-meteo.com/v1/forecast?latitude=41&longitude=28.9&current=temperature_2m,weather_code&timezone=Europe%2FIstanbul");var j=await r.json();var sic=j.current.temperature_2m;var kod=j.current.weather_code;var durum=kod==0?"Açık ☀️":kod<3?"Parçalı Bulutlu ⛅":kod<50?"Bulutlu ☁️":"Yağmurlu 🌧️";ekle("İstanbul'da şu an: "+sic+"°C, "+durum+" 🌦️ Dışarı çıkacaksan ona göre giyin!","bot");}catch(e){ekle("Havaya bakamadım ama bugün hava güzel gibi!","bot");}}
