<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Çıt Chat</title><style>body{margin:0;font-family:Arial;background:#ffe8c9}.btn{background:#ff7a00;color:#fff;border:none;padding:12px;border-radius:20px;font-weight:bold}.box{background:#fff;margin:10px;border-radius:16px;padding:14px;text-align:center}#chat{padding:12px;display:flex;flex-direction:column;gap:10px}.m{padding:11px 14px;border-radius:16px;font-weight:bold;max-width:85%}.u{background:#ff7a00;color:#fff;align-self:flex-end}.b{background:#111;color:#fff;align-self:flex-start}.small{font-size:11px;opacity:.8}#box{display:flex;padding:10px;gap:6px;position:fixed;bottom:0;left:0;right:0;background:#ffe8c9}#inp{flex:1;padding:13px;border-radius:25px;border:2px solid #111}input[type=text]{padding:12px;border-radius:15px;border:2px solid #111;width:80%}.friend{background:#fff;margin:8px;border-radius:16px;padding:12px;display:flex;gap:10px;align-items:center}.topbar{background:#111;color:#fff;padding:14px;display:flex;justify-content:space-between}.fab{background:#ff7a00;color:#fff;border:none;width:55px;height:55px;border-radius:50%;font-size:28px;position:fixed;bottom:20px;right:20px}
#welcome{min-height:100vh;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
.logo{width:150px;height:150px;background:#ff7a00;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:90px}
#welcome h1{font-size:42px;margin:10px 0 0}.slogan{color:#ff7a00;font-weight:bold;font-size:22px}.desc{font-size:14px;margin:10px 0 20px}
#welcome input{width:90%;max-width:350px;padding:15px;border-radius:14px;border:2px solid #111;font-size:16px}
.basla{width:90%;max-width:350px;background:#ff7a00;color:#fff;border:none;padding:16px;border-radius:14px;font-size:22px;font-weight:bold;margin-top:14px}
.terms{font-size:13px;margin-top:14px}.terms b{color:#ff7a00}
header{background:#111;color:#fff;padding:10px;display:flex;gap:10px;align-items:center}.avatar{width:50px;height:50px;background:#ff7a00;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px}
</style></head><body>

<div id="welcome">
<div class="logo">🐦</div>
<h1>Çıt Chat</h1>
<div class="slogan">Konuş, çıtla, silinsin!</div>
<div class="desc">Şifresiz. Mesajların okununca otomatik<br>silinir.</div>
<input id="myname" type="text" placeholder="👤  Kullanıcı adın">
<button class="basla" onclick="startApp()">Başla</button>
<div class="terms">Devam ederek <b>Kullanım Koşulları</b> ve<br><b>Gizlilik Politikası</b>'nı kabul etmiş olursun.</div>
</div>

<div id="home" style="display:none">
<div class="topbar"><b>🐦 Çıt Chat</b><span id="myNameShow"></span></div>
<div id="friends"></div>
<button class="fab" onclick="addFriend()">+</button>
</div>

<div id="app" style="display:none">
<header><button class="btn" onclick="back()">←</button><div class="avatar">🐦</div><div style="flex:1"><b id="chatName">Sohbet</b><br><span style="font-size:12px;color:#ff7a00">Çevrimiçi • 60sn sonra silinir</span></div></header>
<div id="chat"></div><div style="height:80px"></div>
<div id="box"><input id="inp" placeholder="Mesaj yaz..."><button class="btn" onclick="sendReal()">➤</button></div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import {getDatabase,ref,push,onChildAdded,remove} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";
const firebaseConfig={apiKey:"BURAYA_APIKEY",authDomain:"cit-chat.firebaseapp.com",databaseURL:"https://cit-chat-default-rtdb.firebaseio.com",projectId:"cit-chat",storageBucket:"cit-chat.appspot.com",messagingSenderId:"123456",appId:"1:123:web:abc"};
let db,myName="",room="",isBot=false;
let friends=JSON.parse(localStorage.getItem('cit_friends')||'[]');
window.startApp=()=>{myName=document.getElementById('myname').value.trim();if(!myName){alert('Kullanıcı adını yaz!');return}localStorage.setItem('cit_name',myName);document.getElementById('welcome').style.display='none';document.getElementById('home').style.display='block';document.getElementById('myNameShow').innerText='👤 '+myName;renderFriends()};
window.renderFriends=()=>{let f=document.getElementById('friends');if(friends.length==0){f.innerHTML=`<div style="text-align:center;padding:40px;color:#888"><div style="font-size:60px">🐦</div><h3>Henüz kimse yok</h3><p>Alttaki <b>+</b> ile istediğin kadar ekle!</p></div>`;return}let h=`<div style="padding:8px"><b>👥 Kişiler (${friends.length})</b></div>`;h+=friends.map((x,i)=>`<div class="friend" onclick="openFriend('${x.name}','${x.room}')"><div class="avatar">🐦</div><div style="flex:1"><b>${x.name}</b><br><span style="font-size:12px;color:#888">Oda: ${x.room}</span></div><span onclick="event.stopPropagation();delFriend(${i})">🗑️</span></div>`).join('');h+=`<div class="friend" onclick="openBot()"><div class="avatar">🤖</div><div style="flex:1"><b>Çıt (Yapay Zeka)</b><br><span style="font-size:12px;color:#888">Merhaba size nasıl yardımcı olabilirim</span></div></div>`;f.innerHTML=h};
window.addFriend=()=>{let n=prompt('Kişinin adı ne?');if(!n)return;let r=prompt(n+' ile ortak Oda Kodu?');if(!r)return;friends.push({name:n,room:r.toUpperCase()});localStorage.setItem('cit_friends',JSON.stringify(friends));renderFriends()};
window.delFriend=(i)=>{if(confirm('Silinsin mi?')){friends.splice(i,1);localStorage.setItem('cit_friends',JSON.stringify(friends));renderFriends()}};
window.openFriend=(n,r)=>{room=r;isBot=false;document.getElementById('home').style.display='none';document.getElementById('app').style.display='block';document.getElementById('chatName').innerText=n;document.getElementById('chat').innerHTML='';try{const app=initializeApp(firebaseConfig);db=getDatabase(app);onChildAdded(ref(db,'rooms/'+room),snap=>{let d=snap.val();if(d.sender!==myName)addMsg(d.text,false,d.sender,snap.key)});}catch(e){}};
window.openBot=()=>{isBot=true;document.getElementById('home').style.display='none';document.getElementById('app').style.display='block';document.getElementById('chatName').innerText='Çıt';document.getElementById('chat').innerHTML='';addMsg('Merhaba size nasıl yardımcı olabilirim',false)};
window.back=()=>{document.getElementById('app').style.display='none';document.getElementById('home').style.display='block'};
window.addMsg=(t,me,sender,key)=>{let c=document.getElementById('chat');let d=document.createElement('div');d.className='m '+(me?'u':'b');d.innerHTML=t+`<div class="small">${sender?sender+' • ':''}⏱ 60 sn sonra silinecek</div>`;c.appendChild(d);if(key)setTimeout(()=>{d.remove();remove(ref(db,'rooms/'+room+'/'+key))},60000)};
window.sendReal=()=>{let i=document.getElementById('inp');let t=i.value.trim();if(!t)return;if(isBot){addMsg(t,true);i.value='';setTimeout(()=>{addMsg('Anladığımdan emin değilim, biraz daha açar mısın? 🐦',false)},600);return}addMsg(t,true,'Sen');try{push(ref(db,'rooms/'+room),{text:t,sender:myName})}catch(e){}i.value=''};
document.getElementById('inp').addEventListener('keydown',e=>{if(e.key==='Enter')sendReal()});
</script></body></html>
