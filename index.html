<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Çıt Chat V7 ULTIMATE</title><style>body{margin:0;font-family:Arial;background:#ffe8c9}header{background:#111;color:#fff;padding:12px;display:flex;gap:10px;align-items:center}header img{width:48px;height:48px;border-radius:50%;border:3px solid #ff7a00;background:#fff}.btn{background:#ff7a00;color:#fff;border:none;padding:12px;border-radius:20px;font-weight:bold;margin:4px}.box{background:#fff;margin:10px;border-radius:16px;padding:14px;text-align:center}#chat{padding:12px;display:flex;flex-direction:column;gap:10px}.m{padding:11px;border-radius:16px;font-weight:bold;max-width:85%}.u{background:#ff7a00;color:#fff;align-self:flex-end}.b{background:#111;color:#fff;align-self:flex-start}#box{display:flex;padding:10px;gap:6px}#inp{flex:1;padding:12px;border-radius:20px;border:2px solid #111}canvas{background:#111;border-radius:12px;margin:10px auto;display:block}.wheel{width:160px;height:160px;border-radius:50%;background:conic-gradient(#ff7a00 0 60deg,#4CAF50 60deg 120deg,#2196F3 120deg 180deg,#9C27B0 180deg 240deg,#FFC107 240deg 300deg,#FF3B30 300deg 360deg);margin:12px auto;display:flex;align-items:center;justify-content:center;font-size:40px;border:5px solid #111;transition:transform 2s}</style></head><body>
<header><img src="cit.png"><div style="flex:1"><b>Çıt Chat V7 ULTIMATE</b><br>🪙 <span id="coin">0</span> • Puan: <span id="puan">0</span></div><button class="btn" onclick="coin+=20;upd();alert('🎁 +20 Coin!')">🎁</button></header>
<div class="box"><b>🎮 OYUN MERKEZİ</b><br><button class="btn" onclick="show('race')">🏎️ Araba</button><button class="btn" onclick="show('wheel')">🎡 Çark</button><button class="btn" onclick="show('mil')">💰 Milyoner</button><button class="btn" onclick="show('pet')">🐦 Besle</button><button class="btn" onclick="show('chat')">💬 Sohbet</button></div>
<div id="game" class="box" style="display:none"></div>
<div id="chat"></div>
<div id="box"><input id="inp" placeholder="Mesaj yaz... arna, çark, milyoner, besle yaz!"><button class="btn" onclick="toggleRec()">🎤</button><button class="btn" onclick="send()">➤</button></div>
<p style="text-align:center;font-size:12px">V7 ULTIMATE • 🎤 basılı tutma, 1 kere bas konuş, tekrar bas bitir</p>
<script>
var coin=0,puan=0,cur='chat',rec=null,chunks=[],isRec=false,petL=1,petH=50,rx=130,ro=[],ri=null,rs=0;
function upd(){document.getElementById('coin').innerText=coin;document.getElementById('puan').innerText=puan}
function add(t,me){var d=document.createElement('div');d.className='m '+(me?'u':'b');d.innerText=t;document.getElementById('chat').appendChild(d)}
function bot(t){setTimeout(()=>add(t,false),600)}
function show(w){cur=w;var g=document.getElementById('game');g.style.display='block';
if(w=='chat'){g.style.display='none';return}
if(w=='race'){g.innerHTML='<h3>🏎️ ARABA</h3><canvas id="rc" width="300" height="300"></canvas><p id="rs">Skor: 0</p><button class="btn" onclick="rx=Math.max(10,rx-30)">⬅️</button><button class="btn" onclick="rx=Math.min(250,rx+30)">➡️</button><br><button class="btn" onclick="startRace()">▶ Başlat</button>'}
if(w=='wheel'){g.innerHTML='<h3>🎡 ÇARK</h3><div class="wheel" id="wh">🎡</div><button class="btn" onclick="spin()">🎡 ÇEVİR!</button><p id="wr">Şansını dene!</p>'}
if(w=='mil'){g.innerHTML='<h3>💰 MİLYONER</h3><p>Türkiye\'nin başkenti?</p><button class="btn" onclick="coin+=50;puan+=20;upd();alert(\'DOĞRU! +50 Coin!\')">Ankara ✅</button><br><button class="btn" onclick="alert(\'Yanlış!\')">İstanbul</button><button class="btn" onclick="alert(\'Yanlış!\')">İzmir</button>'}
if(w=='pet'){g.innerHTML='<h3>🐦 ÇIT BESLE</h3><div style="font-size:70px" id="pe">🐣</div><p>Seviye: <span id="pl">'+petL+'</span> • Açlık: <span id="ph">'+petH+'</span></p><button class="btn" onclick="feed()">🍎 Besle +10 Coin</button>'}
}
function spin(){var w=document.getElementById('wh');w.style.transform='rotate('+(Math.floor(Math.random()*360)+720)+'deg)';setTimeout(()=>{var p=[10,20,5,50,0,100][Math.floor(Math.random()*6)];coin+=p;upd();document.getElementById('wr').innerText=p==0?'Boş geldi!':'Kazandın: +'+p+' Coin!'},2100)}
function feed(){petH=Math.min(100,petH+20);if(petH>=80){petL++;petH=20}coin+=10;upd();document.getElementById('pe').innerText=petL>=3?'🦅':petL>=2?'🐦':'🐣';document.getElementById('pl').innerText=petL;document.getElementById('ph').innerText=petH;alert('Çıt doydu! Seviye '+petL)}
function startRace(){var cv=document.getElementById('rc');if(!cv)return;var c=cv.getContext('2d');rx=130;ro=[];rs=0;clearInterval(ri);ri=setInterval(()=>{if(Math.random()<0.2)ro.push({x:Math.floor(Math.random()*5)*55+10,y:-20});ro.forEach(o=>o.y+=8);ro=ro.filter(o=>o.y<320);var crash=false;ro.forEach(o=>{if(o.y>240&&o.y<300&&Math.abs(o.x-rx)<35)crash=true});if(crash){clearInterval(ri);coin+=rs;upd();alert('KAZA! Skor: '+rs);return}rs++;c.fillStyle='#333';c.fillRect(0,0,300,300);c.fillStyle='#ff7a00';c.fillRect(rx,240,40,50);c.fillStyle='#FF3B30';ro.forEach(o=>c.fillRect(o.x,o.y,40,50));document.getElementById('rs').innerText='Skor: '+rs},100)}
function toggleRec(){if(isRec){rec.stop();isRec=false;return}navigator.mediaDevices.getUserMedia({audio:true}).then(s=>{rec=new MediaRecorder(s);chunks=[];isRec=true;alert('🔴 Kaydediliyor! Bitirmek için tekrar 🎤 bas!');rec.ondataavailable=e=>chunks.push(e.data);rec.onstop=()=>{var url=URL.createObjectURL(new Blob(chunks,{type:'audio/webm'}));add('🎤 Sesli Mesajın!',true);var a=document.createElement('audio');a.controls=true;a.src=url;document.getElementById('chat').appendChild(a);coin+=5;upd();bot('Sesin harika! +5 Coin! 🎤')};rec.start()}).catch(()=>alert('Mikrofon izni lazım!'))}
function send(){var i=document.getElementById('inp');var t=i.value.trim();if(!t)return;add(t,true);i.value='';var k=t.toLowerCase();
if(k.includes('araba')||k.includes('yarış')){bot('🏎️ Araba açılıyor!');setTimeout(()=>show('race'),700);return}
if(k.includes('çark')||k.includes('cark')){bot('🎡 Çark açılıyor!');setTimeout(()=>show('wheel'),700);return}
if(k.includes('milyoner')){bot('💰 Milyoner açılıyor!');setTimeout(()=>show('mil'),700);return}
if(k.includes('besle')){bot('🐦 Besleme açılıyor!');setTimeout(()=>show('pet'),700);return}
if(k.includes('coin')||k.includes('puan')){bot('🪙 Coin: '+coin+' • Puan: '+puan);return}
if(k.includes('selam')||k.includes('merhaba')){bot('Selam! Hoş geldin! 🐦');return}
if(k.includes('film')){bot('🎬 Önerim: Recep İvedik 1 - Kahkaha garantili!');return}
if(k.includes('şarkı')||k.includes('sarki')){bot('🎵 Semicenk - Geçiyor Zaman');return}
bot('Vay be anlat biraz daha! 🐦')}
document.getElementById('inp').addEventListener('keydown',e=>{if(e.key==='Enter')send()});
add('Selam! Ben Çıt 🐦 V7 ULTIMATE! 🏎️ Araba • 🎡 Çark • 💰 Milyoner • 🐦 Besle • 🎤 Ses Kaydı hepsi var! Dene: araba yaz!',false);
</script></body></html>
