<!DOCTYPE html>
<html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Çıt Chat</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#f0f2f5}
#login{position:fixed;inset:0;background:#FF9F1C;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;color:#fff;text-align:center}
#login h1{font-size:50px}.box{background:#fff;width:100%;max-width:340px;border-radius:20px;padding:20px;color:#333;margin-top:15px}
.box input{width:100%;padding:14px;border-radius:12px;border:1px solid #ddd;font-size:16px;margin-bottom:8px}
.box button{width:100%;padding:15px;border:none;border-radius:12px;background:#111;color:#fff;font-weight:800;font-size:17px}
#list{display:none}#list h1{padding:16px;background:#fff}
.item{background:#fff;padding:14px 16px;display:flex;gap:12px;align-items:center;border-bottom:1px solid #eee;cursor:pointer}
#chat{display:none;position:fixed;inset:0;background:#ece5dd;flex-direction:column}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:80%;padding:9px 12px;border-radius:14px}.me{align-self:flex-end;background:#d9fdd3}.other{align-self:flex-start;background:#fff}
.bar{background:#fff;padding:8px;display:flex;gap:8px}.bar input{flex:1;padding:12px;border:none;background:#f0f2f5;border-radius:20px}.bar button{background:#25D366;border:none;width:44px;height:44px;border-radius:50%;color:#fff;font-size:20px}
</style></head><body>
<div id="login"><div style="font-size:100px">🐦</div><h1>Çıt Chat</h1><p>Arkadaşlarınla konuş!</p><div class="box"><input id="ad" placeholder="Adın ne?"><button onclick="giris()">🚀 Sohbete Başla</button></div></div>
<div id="list"><h1>Sohbetler</h1><div class="item" onclick="ac('Çıt AI')"><span style="font-size:30px">🐦</span><div><b>Çıt AI</b><br><small>Selam! Ben Çıt AI</small></div></div><div class="item" onclick="ac('Ayşe Elif')"><span style="font-size:30px">👧</span><div><b>Ayşe Elif</b><br><small>Selam!</small></div></div></div>
<div id="chat"><div style="background:#fff;padding:12px;display:flex;gap:10px;align-items:center"><span style="font-size:24px" onclick="geri()">←</span><b id="isim">Çıt AI</b></div><div class="msgs" id="msgs"></div><div class="bar"><input id="mesaj" placeholder="Mesaj yaz..."><button onclick="gonder()">➤</button></div></div>
<script>
let adim="";
function giris(){let v=document.getElementById('ad').value.trim();if(!v){alert("Önce adını yaz!");return}adim=v;document.getElementById('login').style.display='none';document.getElementById('list').style.display='block';}
function ac(isim){document.getElementById('list').style.display='none';document.getElementById('chat').style.display='flex';document.getElementById('isim').innerText=isim;document.getElementById('msgs').innerHTML='<div class="msg other">Selam '+adim+'! Ben '+isim+' 😊</div>';}
function geri(){document.getElementById('chat').style.display='none';document.getElementById('list').style.display='block';}
function gonder(){let i=document.getElementById('mesaj'),t=i.value.trim();if(!t)return;let m=document.getElementById('msgs');m.innerHTML+='<div class="msg me">'+t+'</div>';i.value="";m.scrollTop=9999;setTimeout(()=>{m.innerHTML+='<div class="msg other">Aynen kral 😂 Çıt çıt 🐦</div>';m.scrollTop=9999;},700);}
</script></body></html>
