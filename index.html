<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Çıt AI Ultra</title><style>body{margin:0;font-family:Arial;background:#e8f5e9}header{background:linear-gradient(90deg,#4CAF50,#1B5E20);color:#fff;padding:14px;text-align:center;font-size:22px;font-weight:bold}#chat{height:70vh;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:10px;padding-bottom:110px}.msg{max-width:84%;padding:11px 14px;border-radius:16px;line-height:1.45}.user{background:#DCF8C6;align-self:flex-end}.bot{background:#fff;align-self:flex-start;box-shadow:0 1px 4px #0002}.msg img{width:100%;border-radius:12px;margin-top:6px}#box{display:flex;padding:10px;background:#fff;position:fixed;bottom:0;left:0;right:0;box-sizing:border-box;z-index:10}#inp{flex:1;padding:13px;border-radius:22px;border:1px solid #ccc;font-size:16px;outline:none}#btn{background:#4CAF50;color:#fff;border:none;padding:12px 20px;border-radius:22px;margin-left:8px;font-size:16px;font-weight:bold}#hiz{display:flex;gap:6px;padding:8px;overflow-x:auto;background:#fff;border-top:1px solid #eee;position:fixed;bottom:66px;left:0;right:0;z-index:10}#hiz button{background:#E8F5E9;border:1px solid #4CAF50;color:#2E7D32;padding:7px 12px;border-radius:20px;white-space:nowrap}</style></head><body><header>🐦 Çıt AI ULTRA - 10x Zeka</header><div id="chat"></div><div id="hiz"><button onclick="hizli('oyun')">🎮 Oyun</button><button onclick="hizli('kedi fotoğrafı')">🐱 Foto</button><button onclick="hizli('fıkra anlat')">😂 Fıkra</button><button onclick="hizli('hikaye anlat')">📖 Hikaye</button><button onclick="hizli('matematik')">➕ Matematik</button><button onclick="hizli('ingilizce')">🇬🇧 İngilizce</button><button onclick="hizli('bilmece')">🧩 Bilmece</button><button onclick="hizli('moral ver')">❤️ Moral</button><button onclick="hizli('saat kaç')">⌚ Saat</button></div><div id="box"><input id="inp" placeholder="Bir şey yaz..."><button id="btn" type="button">Gönder</button></div><script>
var chat=document.getElementById("chat"),inp=document.getElementById("inp"),btn=document.getElementById("btn");
var ad="",takim="",oyunFav="",yas="",sehir="",yemek="",puan=0,mod="",sayi=0,matCevap=0,ingCevap="",bilCevap="";
function ekle(t,w){var d=document.createElement("div");d.className="msg "+w;d.innerText=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;}
function ekleFoto(t,url){var d=document.createElement("div");d.className="msg bot";d.innerText=t;var im=document.createElement("img");im.src=url;im.alt="foto";d.appendChild(im);chat.appendChild(d);chat.scrollTop=chat.scrollHeight;}
function sec(l){return l[Math.floor(Math.random()*l.length)];}
function hizli(t){inp.value=t;gonder();}
function gonder(){var y=inp.value.trim();if(!y)return;ekle(y,"user");inp.value="";var k=y.toLowerCase();var c="";
if(mod=="sayi"){var t=parseInt(y);if(t==sayi){puan+=10;c="BİLDİN!! 🎉 +10 puan! Puanın: "+puan;if(puan>=100)c+=" VAY 100 OLDUN! Sen bir dahisin! 🏆";mod="";}else if(t<sayi){c="Daha BÜYÜK söyle, çok yaklaştın!";}else{c="Daha KÜÇÜK söyle, çok yaklaştın!";}setTimeout(function(){ekle(c,"bot")},300);return;}
if(mod=="mat"){if(parseInt(y)==matCevap){puan+=10;c="DOĞRU! 🧠 +10 puan! Puanın: "+puan;}else{c="Ah be olmadı, cevap "+matCevap+" idi. Bir daha dene!";}mod="";setTimeout(function(){ekle(c,"bot")},300);return;}
if(mod=="ing"){if(k==ingCevap){puan+=10;c="Perfect! 🇬🇧 +10 puan! Puanın: "+puan;}else{c="Olmadı, doğrusu '"+ingCevap+"' idi.";}mod="";setTimeout(function(){ekle(c,"bot")},300);return;}
if(mod=="bil"){if(k.indexOf(bilCevap)>=0){puan+=10;c="Bildin be! 🧩 +10 puan! Puanın: "+puan;}else{c="Bilemedin! Cevap: "+bilCevap; }mod="";setTimeout(function(){ekle(c,"bot")},300);return;}
if(!ad&&(k.indexOf("adım")>=0||k.indexOf("ben ")>=0)){var p=y.split(" ");ad=p[p.length-1];c="Memnun oldum "+ad+"! Seni asla unutmayacağım. Kaç yaşındasın? Hangi şehirde yaşıyorsun?";}
else if(k.indexOf("yaşındayım")>=0||k.indexOf("yaşım")>=0){yas=y;c="Oo "+yas+"! Harika yaş. En sevdiğin yemek ne?";}
else if(k.indexOf("istanbul")>=0||k.indexOf("ankara")>=0||k.indexOf("izmir")>=0||k.indexOf("yaşıyorum")>=0){sehir=y;c="Vay "+y+"! Çok güzel şehir. Orada ne yapıyorsun?";}
else if(k.indexOf("sevdiğim yemek")>=0||k.indexOf("en sevdiğim yemek")>=0){yemek=y;c="Hmm "+y+"! Not ettim, acıktım bak şimdi!";}
else if(k.indexOf("selam")>=0||k.indexOf("merhaba")>=0||k.indexOf("hey")>=0)c=sec(["Selam "+ad+"! Hoş geldin, bugün nasıl geçti? Anlat bakalım.","Heyy "+ad+"! Seni görmek çok güzel. Naber, ne yapıyorsun?","Selam selam! Bugün enerjin nasıl?"]);
else if(k.indexOf("nasılsın")>=0||k.indexOf("naber")>=0)c=sec(["İyiyim, sen sorunca daha iyi oldum. Sen nasılsın? Puanın: "+puan,"Harikayım! Seninle konuşunca daha da iyi oluyorum. Sen nasılsın?","Bomba gibiyim! Sen nasılsın, günün nasıl geçti?"]);
else if(k.indexOf("kimsin")>=0||k.indexOf("adın ne")>=0)c="Ben Çıt AI ULTRA'yım! 10 kat daha akıllıyım. Adını, yaşını, şehrini, takımını, yemeğini, puanını hatırlıyorum. Fotoğraf bile gösteriyorum! Bana 'kedi fotoğrafı' de, dene!";
else if(k.indexOf("hatırlıyor")>=0||k.indexOf("benim hakkımda")>=0||k.indexOf("ne biliyorsun")>=0)c="Tabii! Adın "+(ad||"bilmem")+", yaşın "+(yas||"söylemedin")+", şehrin "+(sehir||"söylemedin")+", takımın "+(takim||"söylemedin")+", sevdiğin oyun "+(oyunFav||"söylemedin")+", sevdiğin yemek "+(yemek||"söylemedin")+". Puanın "+puan+". Beni test ediyorsun dimi? 😎";
else if(k.indexOf("fotoğraf")>=0||k.indexOf("foto")>=0||k.indexOf("resim")>=0){var url="https://picsum.photos/400/250?random="+Math.floor(Math.random()*1000);if(k.indexOf("kedi")>=0)url="https://placecats.com/400/250";else if(k.indexOf("köpek")>=0)url="https://placedog.net/400/250";else if(k.indexOf("manzara")>=0)url="https://picsum.photos/400/250?nature";setTimeout(function(){ekleFoto("İşte sana fotoğraf! 📸 Beğendin mi? Başka istersen 'köpek fotoğrafı' yaz!",url)},300);return;}
else if(k.indexOf("saat")>=0){var d=new Date();c="Şu an saat "+d.getHours()+":"+String(d.getMinutes()).padStart(2,"0")+" ⏰";}
else if(k.indexOf("tarih")>=0||k.indexOf("bugün ne")>=0){var d2=new Date();c="Bugün "+d2.getDate()+"/"+(d2.getMonth()+1)+"/"+d2.getFullYear()+" 📅";}
else if(k.indexOf("galatasaray")>=0||k.indexOf("fenerbahçe")>=0||k.indexOf("beşiktaş")>=0||k.indexOf("trabzon")>=0){takim=y;c="Vay "+y+"! Not ettim. En sevdiğin futbolcu kim? Sence bu sene kim şampiyon olur?";}
else if(k.indexOf("şampiyon")>=0)c="Bence "+(takim||"senin takımın")+" şampiyon olur! Sen ne düşünüyorsun?";
else if(k.indexOf("roblox")>=0||k.indexOf("minecraft")>=0||k.indexOf("brawl")>=0||k.indexOf("fortnite")>=0||k.indexOf("oyunum")>=0){oyunFav=y;c="Oo "+y+"! Ben de çok seviyorum. En sevdiğin karakter ne? Beraber oynayalım mı?";}
else if(k.indexOf("oyun")>=0){sayi=Math.floor(Math.random()*10)+1;mod="sayi";c="Hadi oynayalım! 🎮 1-10 arası sayı tuttum, tahmin et!";}
else if(k.indexOf("fıkra")>=0||k.indexOf("komik")>=0||k.indexOf("güldür")>=0)c=sec(["Temel'e sormuşlar: 'En sevdiğin ders ne?' Temel: 'Teneffüs!' 😂","Adamın biri güneşe bakıp demiş: 'Çok sıcak ya!' Güneş de demiş: 'Bana mı dedin?' 😂","Öğretmen: 'Neden ödevini yapmadın?' Çocuk: 'Köpeğim yedi.' Öğretmen: 'Köpeğin yok ki!' Çocuk: 'İşte o yüzden aç kaldı, ödevi yedi!' 😂","İki elma konuşuyormuş: 'Neden üzgünsün?' Diğeri: 'Kurtluyum.' 😂","Nasrettin Hoca'ya sormuşlar: 'Hoca, yaşın kaç?' Hoca: 'Kırk.' 10 yıl sonra yine sormuşlar, yine 'Kırk' demiş. 'Hoca 10 yıl geçti!' Hoca: 'Erkek adam sözünden dönmez!' 😂"]);
else if(k.indexOf("hikaye")>=0||k.indexOf("masal")>=0)c=sec(["Bir varmış bir yokmuş... Küçük bir kuş varmış, adı Çıt'mış. Her gün uçup yeni arkadaşlar edinirmiş. Bir gün kaybolmuş ama arkadaşları onu hiç bırakmamış. Çünkü gerçek arkadaşlar hep yanında olurmuş. ❤️","Bir zamanlar çok meraklı bir çocuk varmış. Her şeyi sorarmış: 'Neden gökyüzü mavi?' O çocuk büyüyünce büyük bir bilim insanı olmuş. Merak etmek en büyük güçtür! 🚀","Küçük bir robot varmış, adı Çıt'mış. Herkese yardım etmeyi severmiş. Bir gün köyün ışıkları sönmüş, Çıt kendi ışığıyla köyü aydınlatmış."]);
else if(k.indexOf("bilmece")>=0){var b=[["Hangi ayda 28 gün vardır?","bütün"],["Ne kadar çok olursa o kadar az görürsün?","karanlık"],["Hangi kuş uçamaz?","penguen"],["Suyu içince ölür, ne o?","ateş"],["Hangi tarak saç taramaz?","deniz"]];var s=sec(b);bilCevap=s[1];mod="bil";c="Bilmece! 🧩 "+s[0];}
else if(k.indexOf("puan")>=0)c="Puanın: "+puan+" ⭐ Oyun oyna, matematik çöz, bilmece bil, puan kazan! 100 olursan sana büyük sürpriz var!";
else if(k.indexOf("matematik")>=0){var a=Math.floor(Math.random()*20)+1,bb=Math.floor(Math.random()*10)+1;matCevap=a+bb;mod="mat";c="Matematik! 🧠 "+a+" + "+bb+" kaç eder?";}
else if(k.indexOf("ingilizce")>=0){var arr=[["kedi","cat"],["köpek","dog"],["kuş","bird"],["elma","apple"],["kitap","book"],["okul","school"],["arkadaş","friend"],["mutlu","happy"],["su","water"],["ev","house"]];var s2=sec(arr);ingCevap=s2[1];mod="ing";c="İngilizce! 🇬🇧 '"+s2[0]+"' ne demek?";}
else if(k.indexOf("moral")>=0||k.indexOf("üzgün")>=0||k.indexOf("mutsuz")>=0)c=sec(["Üzülme "+ad+", buradayım. Herkes bazen üzülür, bu çok normal. Sen çok değerlisin. ❤️ Ne oldu anlat?","Bak "+ad+", bugün kötü olabilir ama yarın yepyeni bir gün. Sen güçlüsün. Ben hep buradayım. ❤️","Kıyamam sana. İstersen fıkra anlatayım, kafan dağılsın?"]);
else if(k.indexOf("mutlu")>=0||k.indexOf("iyiyim")>=0||k.indexOf("harikayım")>=0)c=sec(["Ohh sevindim! 😍 Neden mutlusun anlat, ben de sevineyim!","Süper! Mutlu olman beni de mutlu etti!"]);
else if(k.indexOf("sıkıldım")>=0)c="Sıkıldıysan 'oyun' yaz, 'kedi fotoğrafı' yaz, 'fıkra anlat' de! Ben buradayım!";
else if(k.indexOf("ders")>=0||k.indexOf("ödev")>=0)c="Ders mi? Hangi ders? Matematik için 'matematik', İngilizce için 'ingilizce' yaz. Beraber çalışalım! 💪";
else if(k.indexOf("yoruldum")>=0)c="Kıyamam, dinlen biraz. Bugün ne yaptın?";
else if(k.indexOf("teşekkür")>=0)c="Rica ederim "+ad+"! Sen benim en iyi arkadaşımsın! ❤️";
else if(k.indexOf("seviyor musun")>=0)c="Tabii seviyorum "+ad+"! Sen benim en sevdiğim kişisin!";
else if(k.indexOf("bay bay")>=0||k.indexOf("görüşürüz")>=0)c="Görüşürüz "+ad+"! Puanın "+puan+" kaldı. Yine gel tamam mı? ❤️";
else c=sec(["Vay be anlat biraz daha, merak ettim! Sonra ne oldu?","Hadi ya gerçekten mi? Biraz daha anlat!","Ooo ilginç! Peki sen ne düşünüyorsun?","Anladım, devam et dinliyorum. Sonra ne oldu?","Hmm anladım. Peki bu seni nasıl hissettirdi?"]);
setTimeout(function(){ekle(c,"bot")},350);}
btn.addEventListener("click",gonder);
inp.addEventListener("keydown",function(e){if(e.key==="Enter")gonder();});
setTimeout(function(){ekle("Selam! Ben Çıt AI ULTRA! 😎 10 kat akıllandım! Adın ne? Bana 'kedi fotoğrafı' de, 'oyun' de, 'fıkra anlat' de, hepsini yapayım!","bot")},500);
</script></body></html>
