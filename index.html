<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Çıt Chat</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#ffe8c9;height:100vh;display:flex;flex-direction:column}
header{background:#111;color:white;padding:10px 12px;display:flex;align-items:center;gap:10px;border-radius:0 0 20px 20px}
header img{width:52px;height:52px;border-radius:50%;border:3px solid #ff7a00;object-fit:cover;background:white}
header h2{font-size:22px}
header p{font-size:12px;color:#ff9d3c}
.spacer{flex:1}
#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:75%;padding:12px 14px;border-radius:16px;font-size:18px;font-weight:bold;line-height:1.3}
.left{background:#111;color:white;align-self:flex-start}
.right{background:#ff7a00;color:white;align-self:flex-end}
.timer{font-size:12px;color:#ff9d3c;font-weight:normal;display:block;margin-top:4px}
.seen{font-size:12px;text-align:right;color:#555;margin-top:2px}
footer{padding:10px;background:#ffe8c9}
.inputBox{background:white;border:2px solid #111;border-radius:30px;display:flex;align-items:center;padding:6px 6px 6px 12px;gap:8px}
.inputBox input{flex:1;border:none;outline:none;font-size:17px}
.inputBox button{border:none;cursor:pointer;font-size:20px;background:none}
.send{background:#ff7a00 !important;color:white;width:42px;height:42px;border-radius:50%;
