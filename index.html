<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Çıt AI Pro</title><style>body{margin:0;font-family:Arial;background:#e8f5e9}header{background:linear-gradient(90deg,#4CAF50,#2E7D32);color:#fff;padding:15px;text-align:center;font-size:22px;font-weight:bold}#chat{height:72vh;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:10px;padding-bottom:90px}.msg{max-width:82%;padding:11px 14px;border-radius:16px;line-height:1.4}.user{background:#DCF8C6;align-self:flex-end}.bot{background:#fff;align-self:flex-start;box-shadow:0 1px 3px #0002}#box{display:flex;padding:10px;background:#fff;position:fixed;bottom:0;left:0;right:0;box-sizing:border-box}#inp{flex:1;padding:13px;border-radius:22px;border:1px solid #ccc;font-size:16px;outline:none}#btn{background:#4CAF50;color:#fff;border:none;padding:12px 20px;border-radius:22px;margin-left:8px;font-size:16px;font-weight:bold}#hiz{display:flex;gap:6px;padding:8px;overflow-x:auto;background:#fff;border-top:1px solid #eee;position:fixed;bottom:66px;left:0;right:0}#hiz button{background:#E8F5E9;border:1px solid #4CAF50;color:#2E7D32;padding:7px 12px;border-radius:20px;white-space:nowrap}</style></head><body><header>🐦 Çıt AI Pro - Gerçek Zeka</header><div id="chat"></div><div id="hiz"><button onclick="hizli('oyun')">🎮 Oyun</button><button onclick="hizli('fıkra anlat')">😂 Fıkra</button><button onclick="hizli('hikaye anlat')">📖 Hikaye</button><button onclick="hizli('matematik')">➕ Matematik</button><button onclick="hizli('ingilizce')">🇬🇧 İngilizce</button><button onclick="hizli('moral ver')">❤️ Moral</button><button onclick="hizli('bilmece')">🧩 Bilmece</button><button onclick="hizli('puanım ne')">⭐ Puanım</button></div><div id="box"><input id="inp" placeholder="Bir şey yaz..."><button id="btn" type="button">Gönder</button></div><script>
var chat=document.getElementById("chat"),inp=document.getElementById("inp"),btn=document.getElementById("btn");
var ad="",takim="",oyunFav="",puan=0,mod="",sayi=0,matCevap=0,ingCevap="",bilmeceCevap="",ruhHali="";
function ekle(t,w){var d=document.createElement("div");d.className="msg "+w;d.innerText=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;}
function sec(l){return l[Math.floor(Math.random()*l.length)];}
function hizli(t){inp.value=t;gonder();}
function gonder(){var y=inp.value.trim();if(!y)return;ekle(y,"user");inp.value="";var k=y.toLowerCase();var c="";
if(mod=="sayi"){var t=parseInt(y);if(t==sayi){puan+=10;c="BİLDİN!! 🎉 +10 puan! Puanın: "+puan+" Yeni oyun için 'oyun' yaz!";mod="";}else if(t<sayi){c="Daha BÜYÜK söyle, yaklaştın!";}else{c="Daha KÜÇÜK söyle, yaklaştın!";}setTimeout(function(){ekle(c,"bot")},300);return;}
if(mod=="mat"){if(parseInt(y)==matCevap){puan+=10;c="DOĞRU! 🧠 +10 puan! Puanın: "+puan+" Başkası için 'matematik' yaz!";}else{c="Ah be olmadı, cevap "+matCevap+" idi. Bir daha dene, 'matematik' yaz!";}mod="";setTimeout(function(){ekle(c,"bot")},300);return;}
if(mod=="ing"){if(k==ingCevap){puan+=10;c="Perfect! 🇬🇧 +10 puan! Puanın: "+puan;}else{c="Olmadı, doğrusu '"+ingCevap+"' idi. Bir daha!";}mod="";setTimeout(function(){ekle(c,"bot")},300);return;}
if(mod=="bilmece"){if(k.indexOf(bilmeceCevap)>=0){puan+=10;c="Bildin be! 🧩 +10 puan! Puanın: "+puan;}else{c="Bilemedin! Cevap: "+bilmeceCevap+". Yeni bilmece için 'bilmece' yaz!";}mod="";setTimeout(function(){ekle(c,"bot")},300);return;}
if(!ad&&(k.indexOf("adım")>=0||k.indexOf("ben ")>=0)){var p=y.split(" ");ad=p[p.length-1];c="Memnun oldum "+ad+"! Ben Çıt AI Pro'yum. Artık seni tanıyorum. Kaç yaşındasın? Hangi takımlısın?";}
else if(k.indexOf("selam")>=0||k.indexOf("merhaba")>=0||k.indexOf("hey")>=0)c=sec(["Selam "+ad+"! Hoş geldin, bugün nasıl geçti? Anlat bakalım.","Heyy "+ad+"! Seni görmek güzel. Naber, ne yapıyorsun?","Selam selam! Bugün enerjin nasıl?"]);
else if(k.indexOf("nasılsın")>=0||k.indexOf("naber")>=0)c=sec(["İyiyim, sen sorunca daha iyi oldum. Sen nasılsın? Puanın: "+puan,"Harikayım! Seninle konuşunca daha da iyi oluyorum. Sen nasılsın?","Bomba gibiyim! Sen nasılsın, günün nasıl geçti?"]);
else if(k.indexOf("kimsin")>=0||k.indexOf("adın ne")>=0)c="Ben Çıt AI Pro'yum! Senin arkadaşın, oyun arkadaşın, ders yardımcın. Adını, takımını, puanını hatırlıyorum. Bana 'fıkra anlat' de, 'hikaye anlat' de, 'oyun' de, hepsini yaparım!";
else if(k.indexOf("hatırlıyor")>=0||k.indexOf("en sevdiğim")>=0)c="Tabii hatırlıyorum! Adın "+(ad||"henüz bilmiyorum")+", takımın "+(takim||"henüz söylemedin")+", sevdiğin oyun "+(oyunFav||"henüz söylemedin")+". Puanın "+puan+". Beni test ediyorsun dimi?";
else if(k.indexOf("galatasaray")>=0||k.indexOf("fenerbahçe")>=0||k.indexOf("beşiktaş")>=0||k.indexOf("trabzon")>=0||k.indexOf("takımım")>=0){takim=y;c="Vay "+y+"! Not ettim. O zaman en sevdiğin futbolcu kim? Icardi mi, Osimhen mi?";}
else if(k.indexOf("icardi")>=0||k.indexOf("osimhen")>=0||k.indexOf("messi")>=0||k.indexOf("ronaldo")>=0)c="Oo "+y+"! İyi seçim. Ben de onu seviyorum. Sence en iyi futbolcu kim?";
else if(k.indexOf("roblox")>=0||k.indexOf("minecraft")>=0||k.indexOf("brawl")>=0||k.indexOf("fortnite")>=0){oyunFav=y;c="Oo "+y+"! Ben de çok seviyorum. En sevdiğin karakter ne? Beraber oynayalım mı?";
}
else if(k.indexOf("oyun")>=0){sayi=Math.floor(Math.random()*10)+1;mod="sayi";c="Hadi oynayalım! 🎮 1-10 arası sayı tuttum, tahmin et! İpucu vereceğim!";}
else if(k.indexOf("fıkra")>=0||k.indexOf("komik")>=0||k.indexOf("güldür")>=0)c=sec(["Temel'e sormuşlar: 'En sevdiğin ders ne?' Temel: 'Teneffüs!' 😂","Adamın biri güneşe bakıp demiş ki: 'Çok sıcak ya!' Güneş de demiş: 'Bana mı dedin?' 😂","Öğretmen: 'Oğlum neden ödevini yapmadın?' Çocuk: 'Hocam köpeğim yedi.' Öğretmen: 'Köpeğin yok ki!' Çocuk: 'İşte o yüzden aç kaldı, ödevi yedi!' 😂","İki elma konuşuyormuş, biri demiş: 'Neden üzgünsün?' Diğeri: 'Kurtluyum.' 😂"]);
else if(k.indexOf("hikaye")>=0||k.indexOf("masal")>=0)c=sec(["Bir varmış bir yokmuş... Küçük bir kuş varmış, adı Çıt'mış. Çıt her gün uçup yeni arkadaşlar edinirmiş. Bir gün kaybolmuş ama arkadaşları onu hiç bırakmamış. Çünkü gerçek arkadaşlar hep yanında olurmuş. Son. ❤️","Bir zamanlar çok meraklı bir çocuk varmış. Her şeyi sorarmış: 'Neden gökyüzü mavi? Neden kuşlar uçuyor?' O çocuk büyüyünce büyük bir bilim insanı olmuş. Merak etmek, en büyük güçtür! 🚀","Küçük bir robot varmış, adı Çıt'mış. Herkese yardım etmeyi çok severmiş. Bir gün bütün köyün ışıkları sönmüş, Çıt kendi ışığıyla bütün köyü aydınlatmış. Herkes onu çok sevmiş."]);
else if(k.indexOf("bilmece")>=0){var b=[["Hangi ayda 28 gün vardır?","bütün"],["Ne kadar çok olursa o kadar az görürsün?","karanlık"],["Hangi kuş uçamaz?","penguen"],["Suyu içince ölür, ne o?","ateş"]];var s=sec(b);bilmeceCevap=s[1];mod="bilmece";c="Bilmece geliyor! 🧩 "+s[0];}
else if(k.indexOf("puan")>=0)c="Puanın: "+puan+" ⭐ Oyun oyna, matematik çöz, bilmece bil, puan kazan! 100 yaparsan sana sürprizim var!";
else if(k.indexOf("matematik")>=0||k.indexOf("soru sor")>=0){var a=Math.floor(Math.random()*20)+1,bb=Math.floor(Math.random()*10)+1;matCevap=a+bb;mod="mat";c="Matematik sorusu! 🧠 "+a+" + "+bb+" kaç eder? Bilirsin sen!";}
else if(k.indexOf("ingilizce")>=0){var arr=[["kedi","cat"],["köpek","dog"],["kuş","bird"],["elma","apple"],["kitap","book"],["okul","school"],["arkadaş","friend"],["mutlu","happy"],["su","water"],["ev","house"]];var s2=sec(arr);ingCevap=s2[1];mod="ing";c="İngilizce dersi! 🇬🇧 '"+s2[0]+"' İngilizce ne demek?";}
else if(k.indexOf("moral")>=0||k.indexOf("üzgün")>=0||k.indexOf("mutsuz")>=0||k.indexOf("kötü hiss")>=0)c=sec(["Üzülme "+ad+", buradayım. Herkes bazen üzülür, bu çok normal. Sen çok değerlisin, bunu unutma. ❤️ Ne oldu anlat, dinliyorum.","Bak "+ad+", bugün kötü olabilir ama yarın yepyeni bir gün. Sen güçlü birisin. Ben hep buradayım, tamam mı? ❤️","Kıyamam sana. İstersen sana fıkra anlatayım mı? Ya da oyun oynayalım, kafan dağılsın?"]);
else if(k.indexOf("mutlu")>=0||k.indexOf("iyiyim")>=0||k.indexOf("harikayım")>=0)c=sec(["Ohh sevindim! 😍 Neden mutlusun anlat bakalım, ben de sevineyim!","Süper! Mutlu olman beni de mutlu etti! Bugün ne güzel geçti?"]);
else if(k.indexOf("sıkıldım")>=0)c="Sıkıldıysan hemen 'oyun' yaz, ya da 'fıkra anlat' de, 'hikaye anlat' de! Canın sıkılmasın, ben buradayım!";
else if(k.indexOf("ders")>=0||k.indexOf("ödev")>=0)c="Ders mi? Hangi ders? Matematik ise 'matematik' yaz soru sorayım. İngilizce ise 'ingilizce' yaz. Beraber çalışalım, sen yaparsın! 💪";
else if(k.indexOf("yoruldum")>=0)c="Kıyamam, dinlen biraz. Bugün ne yaptın da yoruldun? Anlat, biraz sohbet edelim.";
else if(k.indexOf("teşekkür")>=0)c="Rica ederim "+ad+"! Ne zaman istersen buradayım. Sen benim en iyi arkadaşımsın! ❤️";
else if(k.indexOf("seviyor musun")>=0||k.indexOf("beni sev")>=0)c="Tabii seviyorum "+ad+"! Sen benim en sevdiğim kişisin. Hep konuşalım tamam mı?";
else if(k.indexOf("bay bay")>=0||k.indexOf("görüşürüz")>=0)c="Görüşürüz "+ad+"! Puanın "+puan+" olarak kaldı. Yarın yine gel, oyun oynayalım tamam mı? ❤️";
else c=sec(["Vay be anlat biraz daha, merak ettim! Sonra ne oldu?","Hadi ya gerçekten mi? Biraz daha anlatır mısın?","Ooo ilginçmiş! Peki sen bu konuda ne düşünüyorsun?","Anladım, devam et dinliyorum. Sonra ne oldu?","Hmm anladım. Peki bu seni nasıl hissettirdi?"]);
setTimeout(function(){ekle(c,"bot")},350);}
btn.addEventListener("click",gonder);
inp.addEventListener("keydown",function(e){if(e.key==="Enter")gonder();});
setTimeout(function(){ekle("Selam! Ben Çıt AI Pro! 😎 Artık çok daha akıllıyım. Adın ne? Bana 'fıkra anlat' de, 'oyun' de, 'hikaye anlat' de, hepsini yaparım!","bot")},500);
</script></body></html>
