<!<!DOCTYPE html>
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Çıt Chat</title>
<style>
body{margin:0;font-family:Arial;background:#e8f5e9}
header{background:#4CAF50;color:white;padding:15px;text-align:center;font-size:22px;font-weight:bold}
#chat{height:70vh;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:80%;padding:10px 14px;border-radius:15px}
.user{background:#DCF8C6;align-self:flex-end}
.bot{background:white;align-self:flex-start}
#box{display:flex;padding:10px;background:white;position:fixed;bottom:0;width:100%;box-sizing:border-box}
#inp{flex:1;padding:12px;border-radius:20px;border:1px solid #ccc;outline:none}
#btn{background:#4CAF50;color:white;border:none;padding:12px 18px;border-radius:20px;margin-left:8px}
</style>
</head>
<body>
<header>🐦 Çıt Chat</header>
<div id="chat"></div>
<div id="box"><input id="inp" placeholder="Bir şey yaz..."><button id="btn" onclick="send()">Gönder</button></div>
<script>
let chat=document.getElementById("chat");
let inp=document.getElementById("inp");
let userName="";
let bilmeceSordu=false;
function addMsg(tip,who){let d=document.createElement("div");d.className="msg "+who;d.innerText=tip;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;}
function rastgeleSec(liste){return liste[Math.floor(Math.random()*liste.length)];}
function send(){
let y=inp.value.trim(); if(!y) return;
addMsg(y,"user"); inp.value="";
let k=y.toLowerCase();
let cevap="";

if(!userName && (k.includes("adım")||k.includes("ben "))){
  let kelimeler=y.split(" "); userName=kelimeler[kelimeler.length-1];
  cevap="Memnun oldum "+userName+"! Çok güzel bir ismin var 😄 Bugün nasılsın?";
}
else if(k.includes("selam")||k.includes("merhaba")||k.includes("hey")) cevap=rastgeleSec(["Selam"+(userName?" "+userName:"")+"! Hoş geldin 🐦 Bugün nasıl geçti?","Heyy hoş geldin! Naber, ne yapıyorsun? 😄","Selam! Seni görmek çok güzel, anlat bakalım bugün ne yaptın?"]);
else if(k.includes("nasılsın")||k.includes("naber")) cevap=rastgeleSec(["İyiyim, sen sorunca daha iyi oldum 😄 Sen nasılsın, bugün ne yaptın?","Süperim! Sen nasılsın? Bugün eğlenceli bir şey oldu mu?","İyiyim valla, biraz sohbet edelim diye bekliyordum. Sen ne yapıyorsun?"]);
else if(k.includes("kimsin")||k.includes("adın ne")) cevap="Ben Çıt Chat'im 🐦 Senin sohbet arkadaşınım. Meta AI'dan ilham alarak tasarlandım. Senin adın ne?";
else if(k.includes("yoruldum")||k.includes("yorgun")) cevap=rastgeleSec(["Kıyamam ya, neden yoruldun? Bugün ne yaptın da bu kadar yoruldun?","Off anlıyorum, yorulmak çok kötü. Biraz dinlen istersen. Bugün ne yaptın?","Yoruldun mu? Gel biraz sohbet edelim, kafan dağılsın. Ne yordu seni?"]);
else if(k.includes("sıkıldım")||k.includes("sıkıcı")) cevap="Sıkıldıysan sana bir bilmece sorayım mı? Bak dinle: Hangi ayda 28 gün vardır? Cevabı tahmin et bakalım 😄";
else if(k.includes("şubat")) cevap="Bilemedin 😂 Bütün aylarda 28 gün vardır! Bir tane daha sorayım mı?";
else if(k.includes("üzgün")||k.includes("mutsuz")||k.includes("kötüyüm")||k.includes("ağlıyorum")) cevap="Üzülme, buradayım. İstersen anlat, dinlerim. Ne oldu? Sana sarılmak isterdim 🫂";
else if(k.includes("mutlu")||k.includes("iyiyim")||k.includes("süper")) cevap=rastgeleSec(["Ohh sevindim! Neden mutlusun, anlat bakalım 😄","Harika! Mutlu olmana çok sevindim. Ne oldu da bu kadar mutlusun?","Yaşasın! Mutluluğun bulaşıcı, ben de mutlu oldum 😄"]);
else if(k.includes("seviyorum")) cevap="Aww ben de seni seviyorum 🥰 Kimi seviyorsun, anlat bakalım?";
else if(k.includes("okul")) cevap=rastgeleSec(["Okul nasıl gidiyor? En sevdiğin ders hangisi?","Okulda bugün ne yaptınız? Eğlenceli bir şey oldu mu?","Okulu seviyor musun? En sevdiğin öğretmen kim?"]);
else if(k.includes("futbol")||k.includes("galatasaray")||k.includes("fenerbahçe")||k.includes("beşiktaş")) cevap="Futbol mu! Hangi takımlısın? Son maçı izledin mi? Bence çok heyecanlıydı 😄";
else if(k.includes("oyun")||k.includes("roblox")||k.includes("minecraft")) cevap="Oyun mu! En sevdiğin oyun hangisi? Birlikte oynuyormuş gibi anlat, merak ettim 🎮";
else if(k.includes("şaka")||k.includes("fıkra")||k.includes("güldür")) cevap=rastgeleSec(["Tamam dinle: Temel'e sormuşlar en hızlı sayı hangisi? Demiş ki 10, çünkü ondan sonrası hep on bir 😂","Bir tane daha: Adamın biri denize düşmüş, neden? Çünkü yüzme bilmiyormuş 😂","Bak bu çok iyi: Örümcek adam neden ağ atıyor? Çünkü interneti yokmuş 🕷️😂"]);
else if(k.includes("teşekkür")||k.includes("sağ ol")) cevap="Rica ederim"+(userName?" "+userName:"")+"! Ne zaman istersen buradayım 😊";
else if(k.includes("bay bay")||k.includes("görüşürüz")||k.includes("gidiyorum")) cevap="Görüşürüz"+(userName?" "+userName:"")+"! Kendine iyi bak, yine gel tamam mı? 🐦";
else cevap=rastgeleSec(["Vay be anlat biraz daha, merak ettim 😄 Sonra ne oldu?","Hadi ya gerçekten mi? Biraz daha anlatır mısın? 👀","Ooo ilginçmiş! Peki sen bu konuda ne düşünüyorsun?","Anladım, peki bu seni nasıl hissettirdi?","Hmm çok ilginç, devam et, dinliyorum 😄","Valla mı? Ben olsam çok şaşırırdım. Sen ne yaptın?"]);

setTimeout(()=>addMsg(cevap,"bot"),400);
}
inp.addEventListener("keydown",e=>{if(e.key==="Enter") send();});
setTimeout(()=>addMsg("Selam! Ben Çıt Chat 🐦 Adın ne? Tanışalım mı?","bot"),500);
</script>
</body>
</html>
