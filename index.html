<!DOCTYPE html>
<html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Çıt Chat</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#f0f2f5}
#login{position:fixed;inset:0;background:linear-gradient(180deg,#FF9F1C,#FF6B35);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;color:#fff;text-align:center;z-index:100}
.badge{background:rgba(255,255,255,.22);padding:8px 16px;border-radius:20px;font-size:14px;font-weight:700;margin-bottom:18px}
.bird{font-size:100px;background:#fff;width:150px;height:150px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 15px 35px rgba(0,0,0,.25);margin-bottom:12px}
#login h1{font-size:52px;font-weight:900}#login p{opacity:.9;margin:8px 0 22px}
.box{background:#fff;width:100%;max-width:360px;border-radius:22px;padding:20px;color:#333}
.box label{font-size:13px;font-weight:700;color:#888;display:block;text-align:left;margin-bottom:6px}
.box input{width:100%;padding:14px;border-radius:12px;border:1px solid #ddd;font-size:16px;outline:none;margin-bottom:6px}
.box button{width:100%;padding:16px;border:none;border-radius:12px;background:#111;color:#fff;font-weight:800;font-size:17px}
#hata{color:red;font-size:13px;font-weight:700;display:none;margin-bottom:8px}
#list{display:none}.head{padding:16px;display:flex;justify-content:space-between;background:#fff}.head h1{font-size:32px}
.coin{background:#FFF7E0;padding:8px 16px;display:flex;justify-content:space-between;font-weight:800;font-size:14px}
.search{background:#fff;padding:0 16px 12px}.search input{width:100%;padding:12px;border:none;background:#f0f2f5;border-radius:20px;outline:none}
.tit{background:#fff;padding:14px 16px;font-weight:800;border-bottom:1px solid #f0f0f0}
.item{display:flex;padding:12px 16px;gap:12px;align-items:center;cursor:pointer;border-bottom:1px solid #f0f0f0;background:#fff}
.av{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;color:#fff;font-weight:800}
.inf{flex:1;min-width:0}.inf b{font-size:17px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.inf p{font-size:14px;color:#666;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fabw{position:fixed;right:18px;bottom:22px;display:flex;flex-direction:column;align-items:center;gap:8px}
.mini{width:38px;height:38px;border-radius:50% 50% 50% 4px;background:#fff;border:2px solid #25D366;display:flex;align-items:center;justify-content:center;font-size:18px}
.fab{width:68px;height:68px;border-radius:50%;background:#FF9F1C;border:4px solid #fff;display:flex;align-items:center;justify-content:center;font-size:36px}
#chat{display:none;position:fixed;inset:0;background:#ece5dd;flex-direction:column;z-index:20}
.chead{background:#fff;padding:10px 12px;display:flex;align-items:center;gap:10px}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:78%;padding:9px 12px;border-radius:14px;font-size:15px}.me{align-self:flex-end;background:#d9fdd3}.other{align-self:flex-start;background:#fff}
.bar{background:#fff;padding:8px;display:flex;gap:8px}.bar input{flex:1;padding:12px;border:none;background:#f0f2f5;border-radius:20px;outline:none}.bar button{background:#25D366;border:none;width:44px;height:44px;border-radius:50%;font-size:20px;color:#fff}
.room{background:#fff3d6;padding:10px;text-align:center;font-size:13px}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30;align-items:center;justify-content:center;padding:20px}
.mbox{background:#fff;width:100%;max-width:360px;border-radius:20px;padding:20px;text-align:center}.mbox input{width:100%;padding:12px;border-radius:12px;border:1px solid #ddd;margin-bottom:10px}.mbox button{width:100%;padding:12px;border:none;border-radius:12px;background:#25D366;color:#fff;font-weight:800}.mbox .ipt{background:#eee;color:#333;margin-top:8px}
</style></head><body>

<div id="login"><div class="badge">🟢 1.240 çevrimiçi</div><div class="bird">🐦</div><h1>Çıt Chat</h1><p>Arkadaşlarınla konuş, Çıt AI ile eğlen!</p>
<div class="box"><label>Adın ne? *</label><input id="adInput" placeholder="Adını yazmadan giremezsin!" onkeydown="if(event.key==='Enter')girisYap()"><div id="hata">⚠️ Önce adını yaz kral!</div><button onclick="girisYap()">🚀 Sohbete Başla</button><small style="color:#888;font-size:12px;display:block;margin-top:10px">Adını yazman zorunlu!</small></div></div>

<div id="list"><div class="head"><h1>Sohbetler</h1><span>🔍 ⋮</span></div><div class="coin"><span>🪙 Çıtcoin: <span id="coinSayi">0</span></span><span onclick="marketAc()">🛒 Market</span></div><div class="search"><input id="ara" placeholder="🔍 Ara" oninput="listele()"></div><div class="tit">👥 Kişiler</div><div id="liste"></div><div class="fabw"><div class="mini" onclick="ekleAc()">💬</div><div class="fab" onclick="citAc()">🐦</div></div></div>

<div id="chat"><div class="chead"><span style="font-size:24px;cursor:pointer" onclick="geri()">←</span><div class="av" id="cAv" style="width:42px;height:42px;font-size:20px">🐦</div><div style="flex:1"><b id="cName">Çıt AI</b><br><small>çevrimiçi</small></div></div><div class="room" id="roomBox" style="display:none">Oda Kodu: <b id="roomKod"></b></div><div class="msgs" id="msgs"></div><div class="bar"><input id="mesajInput" placeholder="Mesaj yaz..." onkeydown="if(event.key==='Enter')gonder()"><button onclick="gonder()">➤</button></div></div>

<div id="modal"><div class="mbox"><h3>💬 Kişi Ekle</h3><input id="yeniAd" placeholder="Kişinin adı"><input id="yeniKod" placeholder="Oda Kodu (örn: abdullah123)"><button onclick="kaydet()">✅ Ekle ve Başla</button><button class="ipt" onclick="document.getElementById('modal').style.display='none'">Vazgeç</button></div></div>

<script>
let ad="",coin=parseInt(localStorage.getItem('citcoin')||0),kisiler=JSON.parse(localStorage.getItem('citkisiler')||'[{"ad":"Çıt AI","emoji":"🐦","renk":"#FF9F1C","son":"Selam! Ben Çıt AI 🐦"},{"ad":"Ayşe Elif","emoji":"👧","renk":"#FF6B9D","son":"Selam! Ne yapıyorsun?"}]'),aktif=null,aktifKod="";
function girisYap(){let v=document.getElementById('adInput').value.trim();if(!v){document.getElementById('hata').style.display='block';return}ad=v;localStorage.setItem('citad',ad);document.getElementById('login').style.display='none';document.getElementById('list').style.display='block';coinGuncelle();listele();
</script>
</body>
</html>
